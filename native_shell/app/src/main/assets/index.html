  // ---------- 页脚实时状态：本机时间 + 电量 ----------
  // 注意：这是「阅读页自己的底栏」，不是系统状态栏；菜单/主屏顶部那套假状态栏才是要删的。
  // 电量通过 navigator.getBattery 读取真实设备电量；充电时在电池图标内叠一道闪电。
  let batteryInfo = { level:-1, charging:false, supported:false };
  function currentTimeStr(){
    const d = new Date();
    const hh = String(d.getHours()).padStart(2,"0");
    const mm = String(d.getMinutes()).padStart(2,"0");
    return hh + ":" + mm;
  }
  function batterySvg(level, charging){
    // 归一化电量：兼容 0~1（标准 getBattery.level）与 0~100（部分实现）两种量程
    let lvl;
    if(typeof level === "number" && !isNaN(level)){
      lvl = (level > 1) ? level / 100 : level;   // >1 视为百分比
    } else {
      lvl = -1;   // 未知电量
    }
    lvl = Math.max(0, Math.min(1, lvl));
    const fillW = lvl < 0 ? 0 : Math.round(lvl * 12.6);   // 内芯可用宽度 12.6（x2.6~15.2）
    const bolt = charging
      ? '<path d="M10.6 2.6 L6.8 6.6 L9.4 6.6 L8.2 9.4 L13 4.8 L10.4 4.8 Z" fill="currentColor"/>'
      : "";
    return '<svg width="22" height="12" viewBox="0 0 22 12" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
      '<rect x="0.6" y="0.6" width="17.8" height="10.8" rx="2.2" stroke="currentColor" stroke-width="1.2"/>' +
      '<rect x="2.6" y="2.6" width="'+fillW+'" height="6.8" rx="1" fill="currentColor" opacity="0.4"/>' +
      '<rect x="19.4" y="3.6" width="2" height="4.8" rx="1" fill="currentColor"/>' + bolt + '</svg>';
  }
  function battHtml(){
    return '<span class="r-batt">'+ batterySvg(batteryInfo.level, batteryInfo.charging) +'<span>'+ currentTimeStr() +'</span></span>';
  }
  function refreshStatusDOM(){
    const st = (topLayer && topLayer.querySelector) ? topLayer.querySelector(".rp-status") : null;
    if(!st) return;
    const b = st.querySelector(".r-batt");
    if(b) b.outerHTML = battHtml();
  }
  function initLiveStatus(){
    setInterval(()=>{ refreshStatusDOM(); }, 30000);   // 每 30s 刷新一次时间
    if(navigator.getBattery){
      navigator.getBattery().then(b=>{
        batteryInfo.supported = true;
        const upd = ()=>{
          // 归一化读取电量：兼容 0~1 与 0~100 两种量程；无效值则保留上次（不误显满格）
          if(typeof b.level === "number" && !isNaN(b.level)){
            batteryInfo.level = (b.level > 1) ? b.level/100 : b.level;
          }
          batteryInfo.charging = !!b.charging;
          refreshStatusDOM();
        };
        upd();
        b.addEventListener("levelchange", upd);
        b.addEventListener("chargingchange", upd);
      }).catch(()=>{ batteryInfo.supported = false; batteryInfo.level = -1; });
    }
  }

  // ---------- 屏幕切换 ----------
  // tab 页顺序：决定平移方向（往右切，新页从右侧推入；往左切，从左侧推入）
  const TAB_ORDER = ["bookshelf", "import", "mine"];
  let curTab = 0;

  // 三页摆位：当前页 translateX(0)，左侧 -100%，右侧 +100%；底栏等量反向抵消。
  // instant=true 时不走过渡（首帧定位，别让用户开机就看到页面横向滑动）。
  function applyTabOffset(instant){
    document.querySelectorAll(".tab-page").forEach(p=>{
      const i = TAB_ORDER.indexOf(p.id);
      if(i < 0) return;
      const off = (i - curTab) * 100;
      const nav = p.querySelector(".bottom-nav");
      if(instant){
        p.style.transition = "none";
        if(nav) nav.style.transition = "none";
      }
      p.style.transform = "translate3d(" + off + "%,0,0)";
      // 只有当前页可交互：三页都叠在同一个屏幕位置，不加这层会点到别的页上
      p.style.pointerEvents = (i === curTab) ? "" : "none";
      if(nav){
        nav.style.transform = "translate3d(" + (-off) + "%,0,0)";
        // 反向位移后三份底栏在屏幕上完全重合，靠「三份状态一致」来保证观感一致
        //（highlights 由 syncNav 统一），这里绝不能用 visibility 切显隐：
        // 那会让每份底栏在切页时销毁重建渲染层，真机上一眼就能看到底栏闪一下。
        nav.style.pointerEvents = (i === curTab) ? "" : "none";
      }
    });
    if(instant){
      // 下一帧再放开过渡，否则首帧这次定位会被当成一次动画播出来
      requestAnimationFrame(()=>{
        document.querySelectorAll(".tab-page, .tab-page .bottom-nav").forEach(el=>{
          el.style.transition = "";
        });
      });
    }
  }

  // 高亮同步独立成一处：三份底栏都跟着当前页走，任何改变 curTab 的路径都要过它
  function syncNav(id){
    document.querySelectorAll(".bottom-nav").forEach(nav=>{
      nav.querySelectorAll(".nav-item").forEach(it=>{
        it.classList.toggle("on", it.dataset.screen===id);
      });
    });
  }

  function showScreen(id){
    document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
    document.getElementById(id).classList.add("active");
    // 切到 tab 页时更新轨道位置（"reading" 不在轨道里，保持原位置，返回就回到原来的 tab）
    const ti = TAB_ORDER.indexOf(id);
    if(ti >= 0) curTab = ti;
    applyTabOffset();
    syncNav(id);
    csbReset();   // 换屏时收掉滚动条，别留在新画面上
    // 离开阅读页时兜底落盘一次：读过就绝不丢进度（目录跳章、只看两行就返回都算一次阅读位置）
    if(id !== "reading" && currentBook) saveProgress();
    // 离开书架时收起搜索：回到书架永远是完整、干净的列表
    if(id !== "bookshelf"){
      const sbEl = document.getElementById("searchBar");
      if(sbEl && sbEl.classList.contains("on")) setShelfSearch(false);
    }
    // 真机状态栏 / 地址栏底色跟着当前屏走
    syncThemeColor(id === "reading" ? ((themes[curTheme] && themes[curTheme].bg) || "#E8D5B0") : "#EFE6CE");
  }

  // ---------- 自绘滚动条：替代原生滚动条（滑动浮现 / 停手淡出 / 可拖把手） ----------
  const csbWrap    = document.querySelector(".screen-wrap");
  const csbLayer   = document.getElementById("csb");
  const csbThumbEl = document.getElementById("csbThumb");
  const CSB_IDLE   = 900;          // 停手多久后淡出（ms）
  const CSB_HOSTS  = ["bookGrid", "subBody", "mineBody"];   // 目录有专用把手，不走通用滚动条
  let csbHost = null, csbTimer = 0, csbDrag = null, csbGeo = null;

  // 量当前几何：位置相对 screen-wrap，把手长度按可视比例算
  function csbMeasure(host){
    const max = host.scrollHeight - host.clientHeight;
    if(max <= 1) return null;                       // 不足一屏，不出现
    const r = host.getBoundingClientRect();
    const w = csbWrap.getBoundingClientRect();
    const H = Math.round(r.height), pad = 4, track = H - pad * 2;
    const ratio = Math.max(0.06, Math.min(1, host.clientHeight / Math.max(1, host.scrollHeight)));
    return {
      host, max, H, pad, track,
      th:   Math.max(26, Math.round(track * ratio)),
      left: Math.round(r.left - w.left + r.width - 12),
      top:  Math.round(r.top - w.top),
      dark: curTheme === "black" && !!host.closest("#reading")
    };
  }

  function csbRender(host){
    const g = csbMeasure(host);
    if(!g){ csbGeo = null; csbLayer.classList.remove("show"); return; }
    csbGeo = g; csbHost = host;
    csbLayer.style.left   = g.left + "px";
    csbLayer.style.top    = g.top + "px";
    csbLayer.style.width  = "12px";
    csbLayer.style.height = g.H + "px";
    csbLayer.classList.toggle("on-dark", g.dark);
    const p = Math.max(0, Math.min(1, host.scrollTop / g.max));
    csbThumbEl.style.height = g.th + "px";
    csbThumbEl.style.top    = Math.round(g.pad + (g.track - g.th) * p) + "px";
  }

  function csbPing(host){
    csbRender(host);
    csbLayer.classList.add("show");
    clearTimeout(csbTimer);
    if(csbDrag) return;                             // 拖动中不排隐藏
    csbTimer = setTimeout(()=>{ if(!csbDrag) csbLayer.classList.remove("show"); }, CSB_IDLE);
  }

  function csbReset(){
    clearTimeout(csbTimer);
    csbDrag = null; csbGeo = null; csbHost = null;
    csbLayer.classList.remove("show", "drag");
    tocGripHide();          // 目录把手一起收掉
  }

  CSB_HOSTS.forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.addEventListener("scroll", ()=>csbPing(el), { passive:true });
  });

  // 按住把手直接拖（点击轨道不跳转，避免误触）
  csbThumbEl.addEventListener("pointerdown", e=>{
    if(!csbGeo || !csbHost) return;
    e.preventDefault(); e.stopPropagation();
    clearTimeout(csbTimer);
    csbDrag = { y:e.clientY, top:csbHost.scrollTop };
    csbLayer.classList.add("drag");
    try{ csbThumbEl.setPointerCapture(e.pointerId); }catch(_){}
  });
  csbThumbEl.addEventListener("pointermove", e=>{
    if(!csbDrag || !csbGeo) return;
    e.preventDefault();
    const g = csbGeo, span = Math.max(1, g.track - g.th);
    const next = csbDrag.top + ((e.clientY - csbDrag.y) / span) * g.max;
    g.host.scrollTop = Math.max(0, Math.min(g.max, next));
    csbRender(g.host);
  });
  function csbEndDrag(){
    if(!csbDrag) return;
    csbDrag = null;
    csbLayer.classList.remove("drag");
    if(csbHost) csbPing(csbHost);
  }
  csbThumbEl.addEventListener("pointerup", csbEndDrag);
  csbThumbEl.addEventListener("pointercancel", csbEndDrag);

  // ---------- 书架渲染 ----------
  const grid = document.getElementById("bookGrid");

  // ---------- 书架搜索 ----------
  // 收起态就是右上角那枚圆按钮（34px），点开时圆角胶囊从按钮位置向左延伸成输入框，
  // 展开宽度 = calc(100% - 40px)，正好从右边距走到左边距，把「书架」标题盖住。
  const searchBar   = document.getElementById("searchBar");
  const searchInput = document.getElementById("searchInput");
  let shelfQuery = "";          // 当前搜索词（小写比较）
  let shelfSearchOn = false;

  function setShelfSearch(on){
    if(shelfSearchOn === on) return;
    shelfSearchOn = on;
    searchBar.classList.toggle("on", on);
    if(on){
      // 等宽度动画走一小段再聚焦，否则移动端键盘弹起会把动画挤掉
      setTimeout(()=>{ if(shelfSearchOn){ try{ searchInput.focus(); }catch(e){} } }, 170);
    } else {
      searchInput.value = "";
      searchInput.blur();
      if(shelfQuery){ shelfQuery = ""; renderShelf(); }
    }
  }

  document.getElementById("searchToggle").addEventListener("click", e=>{
    e.stopPropagation();
    setShelfSearch(!shelfSearchOn);
  });
  searchInput.addEventListener("input", ()=>{
    const q = searchInput.value.trim();
    if(q === shelfQuery) return;
    shelfQuery = q;
    grid.scrollTop = 0;        // 换关键词回到顶部，别停在上一轮滚动位置
    renderShelf();
  });
  // 回车＝收起键盘、保留筛选结果（搜索是实时的，不需要提交）
  searchInput.addEventListener("keydown", e=>{
    if(e.key === "Enter"){ e.preventDefault(); searchInput.blur(); }
  });

  function renderShelf(){
    grid.innerHTML = "";
    const q = shelfQuery.toLowerCase();
    let list = allBooks().slice().sort((a,b)=>{
      const ta = lastReadStore[a.id] || 0;
      const tb = lastReadStore[b.id] || 0;
      return tb - ta;   // 最近阅读过的排最前（左上角），未读（0）自然沉底
    });
    if(q) list = list.filter(b=>String(b.name || "").toLowerCase().includes(q));
    if(!list.length && q){
      const empty = document.createElement("div");
      empty.className = "shelf-empty";
      empty.innerHTML = `<b>没有找到「${escapeHtml(searchInput.value.trim())}」</b>换个关键词试试`;
      grid.appendChild(empty);
      return;
    }
    list.forEach((b,i)=>{
      const pr = getProgress(b);
      const pct = pr.percent || 0;
      const progLabel = pct>0 ? (pct>=100 ? "已读完" : `已读 ${pct}%`) : "未读";
      const el = document.createElement("div");
      el.className="book";
      el.style.animationDelay=(i*0.03)+"s";
      el.innerHTML = `<div class="cover" style="background:${b.color}">${b.name}</div>
                      <div class="name">${b.name}</div><div class="prog">${progLabel}</div>`;
      el.addEventListener("click",()=>openBookById(b.id));
      attachLongPressDelete(el, b);
      grid.appendChild(el);
    });
  }

  // 长按删除：按住卡片 500ms 弹出删除确认；长按期间不触发 click 打开书籍
  function attachLongPressDelete(el, book){
    let timer = null, longFired = false, startX = 0, startY = 0;
    el.addEventListener("pointerdown", e=>{
      longFired = false;
      startX = e.clientX; startY = e.clientY;
      timer = setTimeout(()=>{ longFired = true; openDeleteDialog(book); }, 500);
    });
    el.addEventListener("pointermove", e=>{
      if(!timer) return;
      if(Math.abs(e.clientX-startX) > 12 || Math.abs(e.clientY-startY) > 12){
        clearTimeout(timer); timer = null;   // 移动超过阈值 → 视为滑动，取消长按
      }
    });
    const end = ()=>{ if(timer){ clearTimeout(timer); timer = null; } };
    el.addEventListener("pointerup", end);
    el.addEventListener("pointercancel", end);
    el.addEventListener("pointerleave", end);
    // 长按触发后，抑制紧随其后的 click（否则会打开书籍）
    el.addEventListener("click", e=>{ if(longFired){ e.stopImmediatePropagation(); longFired = false; } }, true);
  }

  // 删除确认弹层
  const delMask = document.getElementById("delMask");
  const delBookName = document.getElementById("delBookName");
  let delTargetBook = null;
  function openDeleteDialog(book){
    delTargetBook = book;
    delBookName.textContent = "《" + book.name + "》";
    delMask.classList.add("show");
  }
  function closeDeleteDialog(){
    delMask.classList.remove("show");
    delTargetBook = null;
  }
  document.getElementById("delCancel").addEventListener("click", closeDeleteDialog);
  delMask.addEventListener("click", e=>{ if(e.target === delMask) closeDeleteDialog(); });
  document.getElementById("delOk").addEventListener("click", async ()=>{
    const book = delTargetBook;
    closeDeleteDialog();
    if(!book) return;
    // 内置书：加入「已删除内置书」黑名单，避免刷新后再出现
    if(book.builtin){
      const idx = builtinBooks.indexOf(book);
      if(idx >= 0) builtinBooks.splice(idx, 1);
      deletedBuiltin.add(book.id);
    } else {
      const idx = importedBooks.indexOf(book);
      if(idx >= 0) importedBooks.splice(idx, 1);
      // 清理该导入书的正文（IndexedDB）与各 store
      const db = await idbOpen();
      if(db){ idbDel(db, "text:"+book.id); idbDel(db, "img:"+book.id); }
      textWritten.delete(book.id);
      delete tocStore[book.id];
    }
    delete progressStore[book.id];
    delete lastReadStore[book.id];
    persist();
    renderShelf();
    updateMine();
  });

  // ---------- 阅读：分页 + 翻页 ----------
  const stage = document.getElementById("readerStage");
  const pageFront = document.getElementById("pageFront");
  const pageBack  = document.getElementById("pageBack");
  const meas = document.getElementById("meas");
  const measBody = document.getElementById("measBody");
  let bookPages = [];   // 分章分页：bookPages[ch] = [页1文本, 页2文本, ...]
  let curChapter = 0;   // 当前章节索引
  let curPage = 0;      // 章内页码（从 0 开始）
  let allTotal = 0;     // 整书总页数（用于右下角整书进度%）
  let animating = false;
  let fontPx = 19;
  const BRIGHT_MAX = 60;    // 亮度上限（最亮）；遮罩不透明度 = (BRIGHT_MAX - 亮度)/100，最暗时 0.6
  let brightVal = BRIGHT_MAX;   // 亮度 0~60，60 = 不遮罩。滑条左＝暗、右＝亮，和两侧太阳图标一致
  let curBookName = "暗流";   // 当前阅读的书名，用于章首页左上角小标题
  let gBodyH = 0, gBodyHFirst = 0;   // 分页实测的正文可用高度，渲染时锁定，保证测量=显示

  // 当前页在整书中的全局序号（从 1 开始）
  function globalNo(ch, pg){
    let n = 0;
    for(let i=0;i<ch;i++) n += (bookPages[i] ? bookPages[i].length : 0);
    return n + pg + 1;
  }

  // 整书进度百分比：分段解析（导入书）下全书尚未完全分页，用目录行号比例估算。
  // 返回**保留一位小数**的值（页脚要显示 68.7% 这种精度）；需要整数的调用方自己 Math.round。
  function wholeBookPercent(ch, pg){
    let pct = 0;
    if(allTotal > 0){
      pct = Math.round(globalNo(ch, pg)/allTotal*1000)/10;
    } else if(currentBook && currentBook.imported && currentBook.toc && currentBook.toc.length){
      const toc = currentBook.toc;
      const totalLines = toc[toc.length-1].end || 1;
      const cur = toc[ch] || toc[0];
      const chLines = Math.max(1, cur.end - cur.start);
      const pages = (bookPages[ch] && bookPages[ch].length) || 1;
      const pageRatio = pg / pages;
      const estLine = cur.start + chLines * pageRatio;
      pct = totalLines ? Math.round(estLine/totalLines*1000)/10 : 0;
    }
    return Math.max(0, Math.min(100, pct));
  }

  // 页脚进度显示：一位小数；读到头时显示 100%，不写 100.0%
  function fmtPct(v){
    return (v >= 99.95 ? "100" : Number(v).toFixed(1)) + "%";
  }

  function escapeHtml(s){ return (s==null ? "" : String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function hexToRgba(hex,a){ hex=hex.replace("#",""); const r=parseInt(hex.substr(0,2),16),g=parseInt(hex.substr(2,2),16),b=parseInt(hex.substr(4,2),16); return `rgba(${r},${g},${b},${a})`; }

  // 页文本 → HTML。测量层（二分）和显示层共用这一份，才能保证「量出来的高度 = 画出来的高度」。
  // 图片行格式 \u0001F|<序号>|<宽>|<高>，宽高已在分页时按行宽/页高换算好，这里只负责画。
  // brief=true 时用同尺寸灰块代替真图：二分测量不需要解码图片，同步、零等待。
  function pageHtml(t, brief){
    return t.split("\n").map(x=>{
      const c0 = x.charCodeAt(0);
      if(c0 === 1) return figHtml(x, brief);
      return (c0 === 11) ? `<p class="cont">${escapeHtml(x.slice(1))}</p>` : `<p>${escapeHtml(x)}</p>`;
    }).join("");
  }
  function figHtml(x, brief){
    const p = x.split("|");
    const w = Math.round(+p[2]), h = Math.round(+p[3]);
    if(!(w > 0 && h > 0)) return "";
    const box = `width:${w}px;height:${h}px`;
    if(brief) return `<div class="rp-fig"><div class="rp-fig-ph" style="${box}"></div></div>`;
    const src = figSrc(+p[1]);
    if(!src) return "";
    return `<div class="rp-fig"><img src="${escapeHtml(src)}" alt="" style="${box}"></div>`;
  }
  // 当前书的图片表（data URL 随书存 IndexedDB，打开时读回内存）
  function figSrc(idx){
    const imgs = currentBook && currentBook.images;
    return (imgs && imgs[idx] && imgs[idx].src) || "";
  }
  function renderPage(text, pageNo, localTotal, title, gNo, isStart, ch, pg, firstH){
    const pct = (ch !== undefined) ? wholeBookPercent(ch, pg) : (allTotal ? Math.round(gNo/allTotal*1000)/10 : 0);
    // 章首页正文高度按「该章自己的标题」量出来（长标题可能占到两行），
    // 不能套用最后一次分页的全局值，否则页脚会被挤到屏幕外
    const bodyH = isStart ? (firstH || gBodyHFirst) : gBodyH;
    const bodyStyle = bodyH > 0 ? ` style="flex:none;height:${bodyH}px"` : "";
    return `<div class="rp-shell${isStart ? " chapter-start" : ""}">
      <div class="rp-chapter">${isStart ? escapeHtml(curBookName) : escapeHtml(title)}</div>
      ${isStart ? `<div class="rp-chapter-big">${escapeHtml(title)}</div>` : ""}
      <div class="rp-body"${bodyStyle}>${pageHtml(text, false)}</div>
      <div class="rp-status">
        ${battHtml()}
        <span class="mid">${pageNo}/${localTotal}</span>
        <span class="r-percent">${fmtPct(pct)}</span>
      </div>
    </div>`;
  }

  // 一行至少放 17 个汉字。按当前字号实测 17 个汉字（含 .03em 字距）有多宽，
  // 把剩余宽度对半分给左右内边距：窄屏（360dp）会自动收到 13px 左右，宽屏也不超过 16px。
  // 这样把默认字号从 18 调到 19 时，每行字数不会被吃掉（19px 时 360 宽屏仍是 17 字）。
  // 用真实 span 量而不是「字号 × 1.03」：不同字体的汉字实际宽度并不等于 font-size。
  // 正文左右边距。2026-11-07 用户定为固定 20px（原先按「一行至少 17 字」自动算：
  // 360 宽屏只有 13px、393 以上 16px 封顶）。想回到自动校准把 PAD_X 改成 0 即可。
  // 注意：页脚两端不跟这个值走，固定 23px（见 .rp-status 的 padding）。
  const PAD_X = 20;
  const MIN_CHARS_PER_LINE = 17;
  function pagePadFor(W, fp){
    if(PAD_X) return PAD_X;
    if(!W) return 16;
    const probe = document.createElement("span");
    probe.textContent = "字".repeat(MIN_CHARS_PER_LINE);
    probe.style.cssText = "position:absolute;left:-9999px;top:0;visibility:hidden;white-space:nowrap;"
      + "font-family:var(--rp-font);font-size:" + fp + "px;letter-spacing:var(--rp-ls, .03em);";
    document.body.appendChild(probe);
    const need = probe.getBoundingClientRect().width;
    probe.remove();
    if(!need) return 16;
    return Math.max(8, Math.min(16, Math.floor((W - need) / 2)));
  }

  // —— 字距：保「一行至少 17 字」——
  // 20px 边距下 360 宽屏只有 320px 行宽，19px 汉字排 17 个要 318px，加 .03em 字距就溢出成 16 字。
  // 与其砍边距或缩字号，不如把字距往下收一点点：负 0.01em ≈ 每字紧 0.19px，肉眼几乎无感。
  // 候选从「最舒展」到「最紧」逐个实测，第一个能排下 17 字的就用它；宽屏第一项就命中，
  // 保持原来的 .03em 手感不变。全都排不下时退回 .03em（320 宽屏要 -0.118em 才够，太挤，
  // 而且字号调大后收紧也挤不出一个字，不如让字好看）。
  const LS_MAX = 0.03;
  const LS_STEPS = [0.03, 0.02, 0.01, 0, -0.005, -0.01, -0.015, -0.02, -0.025, -0.03];
  const lsCache = {};   // 「屏宽|字号|边距」→ 字距，避免每章都重新排一遍测量盒
  function fitLetterSpacing(W, fp, padX){
    const key = W + "|" + fp + "|" + padX;
    if(lsCache[key] !== undefined) return lsCache[key];
    const contentW = W - padX * 2;
    if(!contentW || contentW <= 0) return (lsCache[key] = LS_MAX);

    // 必须真排一次：不同字体的汉字实际宽度不等于 font-size，估算会差出半个字
    const box = document.createElement("div");
    box.style.cssText = "position:absolute;left:-9999px;top:0;visibility:hidden;"
      + "width:" + contentW + "px;font-family:var(--rp-font);font-size:" + fp + "px;"
      + "line-height:1.5;text-align:justify;";
    const par = document.createElement("p");
    par.style.cssText = "margin:0;padding:0;text-indent:0";
    par.textContent = "字".repeat(MIN_CHARS_PER_LINE * 3);
    box.appendChild(par);
    document.body.appendChild(box);

    const node = par.firstChild;
    const r = document.createRange();
    r.setStart(node, 0); r.setEnd(node, 1);
    const top0 = r.getClientRects()[0].top;   // 首行基线：同一行所有字的 top 都等于它

    // 判定只看「第 17 个字是否还在首行」：这个值浏览器给得最诚实。
    // （试过用第 17 字的 right 判余量，行末字符的右缘会被钳到行宽，gap 恒为 0，判不出来。）
    // 命中后若已经动过字距，就再往下多收一档，留出约 1.5~3.5px 的余量 ——
    // headless 与真机字体度量不完全相同，卡在 0px 边界上真机会退回 16 字。
    let picked = LS_MAX;
    for(let i = 0; i < LS_STEPS.length; i++){
      const ls = LS_STEPS[i];
      box.style.letterSpacing = ls + "em";
      r.setStart(node, MIN_CHARS_PER_LINE - 1); r.setEnd(node, MIN_CHARS_PER_LINE);
      const rects = r.getClientRects();
      if(!rects.length) continue;
      if(Math.abs(rects[0].top - top0) <= 1){        // 第 17 字还在首行
        picked = (i > 0 && i + 1 < LS_STEPS.length) ? LS_STEPS[i + 1] : ls;
        break;
      }
    }
    box.remove();
    lsCache[key] = picked;
    return picked;
  }

  // 按字符精确分页：逐字填满每一页，段可跨页接续（消除底部大片留白）
  // 大书保护：单章字符数超上限时，按段落粗分页兜底，绝不让几十 MB 单章做逐字二分卡死主线程
  function paginate(text, title){
    const W = stage.clientWidth, H = stage.clientHeight;
    if(!W || !H) return [text];

    // 先把左右边距与字距定下来再量别的：显示层（.reader-page）与测量层（.page-meas）都读这两个变量，
    // 只改 CSS 或只改 meas 都会让「量出来的行宽」和「画出来的行宽」不一致
    const padX = pagePadFor(W, fontPx);
    document.documentElement.style.setProperty("--rp-pad-x", padX + "px");
    document.documentElement.style.setProperty("--rp-ls", fitLetterSpacing(W, fontPx, padX) + "em");

    // —— 先量固定元素高度（小标题 / 章首页大标题 / 页脚），后面两条分页分支都要用 ——
    meas.style.width = W + "px";
    meas.style.height = H + "px";
    measBody.style.fontSize = fontPx + "px";
    measBody.style.lineHeight = "1.5";
    measBody.style.flex = "none";          // 改用显式高度，不再依赖 flex 推算（避免章首页正文高度被算错）
    measBody.style.height = "auto";
    const measChapter = meas.querySelector(".rp-chapter");
    const measChapterBig = meas.querySelector(".rp-chapter-big");
    const measStatus = meas.querySelector(".rp-status");
    // 用 offsetHeight 量取固定元素真实高度（稳定，不受 flex 时序影响）
    measChapter.textContent = "章";
    // 章首页大标题用「本章真实标题」测量：标题长短直接决定它占一行还是多行
    measChapterBig.textContent = title || "第一章 · 夜行";
    measChapterBig.style.display = "";
    const chH = measChapter.offsetHeight || 32;
    const bigH = measChapterBig.offsetHeight || 50;
    const stH = measStatus.offsetHeight || 24;
    measChapterBig.style.display = "none";   // 翻页测量阶段放大标题不占空间
    measChapterBig.textContent = "";
    measChapter.textContent = "";
    // 正文可用高度 = 总高 − 固定元素；章首页再扣放大标题
    const bodyHUse = Math.max(80, H - chH - stH);
    const bodyHFirstUse = Math.max(80, H - chH - bigH - stH);
    gBodyH = bodyHUse; gBodyHFirst = bodyHFirstUse;   // 记回模块级，供渲染锁定正文高度

    // 粗分页 / 空文本的返回也带上 firstH，渲染时页脚同样不会被长标题顶掉
    const withFirstH = arr => { arr.firstH = bodyHFirstUse; return arr; };

    if(text.length > 120000){
      // 极端长文本：按段落粗分页（每页约 N 段），避免逐字二分的时间/内存爆炸。
      // 图片行的宽高这里也得换算，否则会按原图像素画出去（3000px 宽直接溢出屏幕）
      const contentW = Math.max(40, W - padX * 2);
      const maxFigH = Math.max(80, bodyHUse - 16);
      const fixFig = p => {
        if(p.charCodeAt(0) !== 1) return p;
        const f = p.split("|");
        const ow = +f[2] || 0, oh = +f[3] || 0;
        if(!(ow > 0 && oh > 0)) return "";
        let dw = Math.min(contentW, ow), dh = Math.round(oh * dw / ow);
        if(dh > maxFigH){ dh = maxFigH; dw = Math.max(24, Math.round(ow * dh / oh)); }
        return "\u0001F|" + f[1] + "|" + dw + "|" + dh;
      };
      const paras = text.split("\n").filter(t=>t.length).map(fixFig).filter(t=>t.length);
      const out = [];
      let buf = [];
      let budget = 9000;   // 每页约 9000 字符（粗略）
      let acc = 0;
      for(const p of paras){
        buf.push(p); acc += p.length;
        if(acc >= budget){ out.push(buf.join("\n")); buf = []; acc = 0; }
      }
      if(buf.length) out.push(buf.join("\n"));
      return withFirstH(out.length ? out : [text]);
    }

    const paras = text.split("\n").filter(t=>t.length);
    if(!paras.length) return withFirstH([text]);
    // 摊平为字符流并记录每段序号，便于识别跨页接续段。
    // 图片段（\u0001F|…）只占 1 个「字符」：二分永远切不开它，图片只能整块进某一页，绝不会被劈成两半。
    const chars = [];
    paras.forEach((p, si) => {
      if(p.charCodeAt(0) === 1){ chars.push({ c:"\u0002", seg:si, fig:p }); return; }
      for(const c of p) chars.push({ c, seg:si });
    });

    // 图片显示尺寸：按行宽等比缩，再按页高封顶。必须在分页时就定死，
    // 否则 img 异步解码撑开会把「已经算好的页面高度」推翻。
    const contentW = Math.max(40, W - padX * 2);
    const figCache = {};
    function figFit(w, h){
      if(!(w > 0 && h > 0)) return [0, 0];
      const key = w + "x" + h;
      if(figCache[key]) return figCache[key];
      let dw = Math.min(contentW, w), dh = Math.round(h * dw / w);
      const maxH = Math.max(80, bodyHUse - 16);
      if(dh > maxH){ dh = maxH; dw = Math.max(24, Math.round(w * dh / h)); }
      return (figCache[key] = [dw, dh]);
    }

    // 把 [s,e) 组装成页文本：段间 \n，跨页接续段前缀 \u000b
    function toPageText(s, e){
      let res = "", curSeg = -1;
      for(let k=s;k<e;k++){
        const it = chars[k];
        if(it.seg !== curSeg){
          if(res) res += "\n";
          const cont = (k>0 && chars[k-1].seg === it.seg);  // 本页内该段非首次出现 ⇒ 接续
          if(it.fig){
            // 图片行换成「已换算好的显示尺寸」，渲染时不必再算一次（否则测量与显示可能不一致）
            const f = it.fig.split("|");
            const fit = figFit(+f[2] || 0, +f[3] || 0);
            res += "\u0001F|" + f[1] + "|" + fit[0] + "|" + fit[1];
          } else {
            res += (cont ? "" : "") + it.c;
          }
          curSeg = it.seg;
        } else {
          res += it.c;
        }
      }
      return res;
    }
    const fillHtml = (s, e, isFirst) => {
      measBody.style.height = (isFirst ? bodyHFirstUse : bodyHUse) + "px";
      measBody.innerHTML = pageHtml(toPageText(s, e), true);   // 灰块占位，不解码真图
    };

    const out = [];
    let start = 0;
    while(start < chars.length){
      const first = out.length === 0;
      const bodyH = first ? bodyHFirstUse : bodyHUse;    // 章首页含放大标题，可用高度更小
      // 二分查找本页能容纳的最大字符数 end
      let lo = start, hi = chars.length, best = start;
      while(lo <= hi){
        const mid = (lo + hi) >> 1;
        fillHtml(start, mid, first);
        if(measBody.scrollHeight <= bodyH + 1){ best = mid; lo = mid + 1; }
        else { hi = mid - 1; }
      }
      if(best === start) best = start + 1;          // 安全阀：绝不产生空页
      out.push(toPageText(start, best));
      start = best;
      if(out.length > 3000) break;
    }
    measBody.style.flex = "";
    measBody.style.height = "";
    const pages = out.length ? out : [text];
    pages.firstH = bodyHFirstUse;   // 本章首页正文可用高度（按本章标题实测），渲染时锁它才不会被长标题顶掉页脚
    return pages;
  }

  // 两层页面：topLayer=当前可见页（在上），botLayer=备用层（在下）
  let topLayer = pageFront, botLayer = pageBack;

  // 右缘窄阴影：只给「此刻在上面的那一页」加上，翻页结束/复位时清掉
  function markTopEdge(el){
    if(topLayer) topLayer.classList.remove("edge-shadow");
    if(botLayer) botLayer.classList.remove("edge-shadow");
    if(el) el.classList.add("edge-shadow");
  }
  function clearTopEdge(){
    if(topLayer) topLayer.classList.remove("edge-shadow");
    if(botLayer) botLayer.classList.remove("edge-shadow");
  }

  // 给某页刷上当前主题的 文字色/底色/纸纹，以及章节标题/状态栏的颜色
  function paintPage(p){
    const t = themes[curTheme];
    p.style.color = t.text;
    p.style.backgroundColor = t.bg;
    p.style.backgroundImage = (curTheme==="paper"||curTheme==="sepia") ? `url("${PAPER_TEX}")` : "none";
    p.style.setProperty("--rc", t.title);
    p.style.setProperty("--rs", t.status);
  }

  function renderCurrent(){
    // 防御：目标章可能尚未分页（懒加载未触发）或越界，此时强制补一次分页兜底
    if(!chapters[curChapter]){
      curChapter = Math.max(0, chapters.length-1);
      curPage = 0;
    }
    if(!bookPages[curChapter] || !bookPages[curChapter].length){
      // 该章有正文但尚未分页 → 立即分页（罕见，仅在异常时序下触发）
      const ch = chapters[curChapter];
      bookPages[curChapter] = (ch && ch.body && ch.body.length) ? paginate(ch.body.join("\n"), ch.title) : [""];
      if(curPage >= bookPages[curChapter].length) curPage = 0;
    }
    const ps = bookPages[curChapter] || [""];
    topLayer.innerHTML = renderPage(ps[curPage] || "", curPage+1, ps.length, chapters[curChapter].title, globalNo(curChapter, curPage), curPage===0, curChapter, curPage, ps.firstH);
    paintPage(topLayer);
    botLayer.innerHTML = "";
    topLayer.style.zIndex=2; botLayer.style.zIndex=1;
    topLayer.style.transition="none"; topLayer.style.transform="translateX(0)";
    botLayer.style.transition="none";  botLayer.style.transform="translateX(0)";
    clearTopEdge();   // 复位时去掉翻页残留的右缘阴影
    markToc(curChapter);
    pgSync();         // 同步底部进度线
    schedulePreload();  // 停稳后把后面几章提前切好，避免翻到章末才现切
  }

  // 把全书每章独立分页（保留分章结构，页码按章计数，不动原逻辑）
  // 大书优化：只对「已加载正文」的章做逐字二分（昂贵）；空骨架章给 1 个空占位，绝不逐章二分空正文。
  function paginateBook(){
    bookPages = chapters.map(c => {
      const hasBody = c && c.body && c.body.length;
      return hasBody ? paginate(c.body.join("\n"), c.title) : [""];
    });
    allTotal = bookPages.reduce((a,ps)=>a + (ps ? ps.length : 0), 0);
  }

  // 只重分页「已加载正文」的章节，未加载章保持原占位，避免大书全量二分卡死
  function paginateLoadedChapters(){
    const prev = bookPages;
    bookPages = chapters.map((c, i) => {
      const hasBody = c && c.body && c.body.length;
      if(hasBody) return paginate(c.body.join("\n"), c.title);
      return (prev && prev[i] && prev[i].length) ? prev[i] : [""];
    });
    allTotal = bookPages.reduce((a,ps)=>a + (ps ? ps.length : 0), 0);
  }

  // 增量分页：只补「已有正文但还没分页」的章。
  // 跨章翻页走这条 —— 早先用的是 paginateLoadedChapters，它会把**所有**已加载章重排一遍，
  // 而正文一旦载入就不会释放，于是读得越久、已读章越多，跨章翻页那一下就越慢
  // （读到三十几章时一次要重排三十多章，肉眼可见卡一下）。现在代价只和「新载入的章数」有关。
  function paginateMissing(){
    if(!stage.clientWidth || !stage.clientHeight) return 0;   // 舞台不可见时量出来是错的，宁可不排
    if(bookPages.length !== chapters.length) bookPages.length = chapters.length;   // 换书/换骨架后对齐长度
    let added = 0;
    for(let i = 0; i < chapters.length; i++){
      const c = chapters[i];
      if(!c || !c.body || !c.body.length) continue;
      const ps = bookPages[i];
      // 空占位页（[""]）是「正文还没载入」时留下的，不能当成已分页
      const done = ps && ps.length && !(ps.length === 1 && ps[0] === "");
      if(done) continue;
      bookPages[i] = paginate(c.body.join("\n"), c.title);
      added++;
    }
    if(added) allTotal = bookPages.reduce((a,ps)=>a + (ps ? ps.length : 0), 0);
    return added;
  }

  // 跳到某章首页（目录点击用），无翻页动画直接定位
  // 注意：跳章本身就是一次「阅读位置变更」，必须立刻落盘——
  // 否则用户从目录跳过去、没翻页就退出，下次打开还停在旧章节（进度只在翻页时保存）
  function gotoChapter(i){
    if(!currentBook) return;
    if(i < 0 || i >= chapters.length){ closeToc(); return; }
    if(currentBook.imported && !ensureNavigable(i)){
      // 目标章正文未加载：先补载该章+窗口，再定位
      loadWindowAndPaginate(currentBook, i).then(()=>{
        curChapter = i; curPage = 0;
        if(!bookPages[curChapter]) bookPages[curChapter] = [""];
        if(curPage >= bookPages[curChapter].length) curPage = 0;
        renderCurrent(); closeToc(); saveProgress();
      }).catch(()=>{
        // 补载失败也定位到该章（空占位），不卡死、可继续点
        curChapter = i; curPage = 0;
        if(!bookPages[curChapter]) bookPages[curChapter] = [""];
        renderCurrent(); closeToc(); saveProgress();
      });
      return;
    }
    curChapter = i; curPage = 0; renderCurrent(); closeToc(); saveProgress();
  }

  function flip(dir){
    if(animating) return;
    if(!bookPages || !bookPages.length) return;   // 尚未分页完成，忽略翻页
    let tCh = curChapter, tPage = curPage + dir;
    // 防御：bookPages[tCh] 缺失时补占位，避免 .length 抛错导致翻页卡死
    if(!bookPages[tCh]) bookPages[tCh] = [""];
    if(tPage >= bookPages[tCh].length){
      // 本章已到末页，尝试进入下一章首页
      if(tCh + 1 >= chapters.length){
        // 全书最后一页：停在原地并提示。这里绝不能循环回第一章——
        // 读者点击「下一页」却被送到全书开头，会以为翻页丢位置了。
        showBoundary("已经是最后一页了");
        stage.classList.remove("shake"); void stage.offsetWidth; stage.classList.add("shake");
        return;
      }
      tCh++; tPage = 0;
    } else if(tPage < 0){
      // 本章已到首页，尝试回上一章末页
      if(tCh - 1 < 0){
        showBoundary("已经是第一页了");
        stage.classList.remove("shake"); void stage.offsetWidth; stage.classList.add("shake");
        return;
      }
      tCh--; tPage = 0;   // 先占位首页，正文补载后重排会修正为末页
    }
    // 跨章进入未加载章节：先补载正文，完成后自动继续本次翻页
    if(!ensureNavigable(tCh)){
      const targetCh = tCh, targetDir = dir;
      loadWindowAndPaginate(currentBook, tCh).then(()=>{
        if(!bookPages[targetCh]) bookPages[targetCh] = [""];
        let tp = (targetDir < 0) ? (bookPages[targetCh].length - 1) : 0;
        if(tp < 0) tp = 0;
        doFlipCommit(targetCh, tp);
      }).catch(()=>{
        if(!bookPages[targetCh]) bookPages[targetCh] = [""];
        doFlipCommit(targetCh, 0);
      });
      return;
    }
    // 上一章末页：正文已就绪，修正为目标章末页
    if(dir < 0 && tPage === 0 && curChapter !== tCh){
      tPage = bookPages[tCh].length - 1;
    }
    doFlipCommit(tCh, tPage);
  }

  // 实际执行翻页动画并提交新章节/页码
  function doFlipCommit(tCh, tPage){
    if(tCh < 0 || tCh >= chapters.length) return;
    const incoming = botLayer, visible = topLayer;
    const dir = (tCh > curChapter) || (tCh === curChapter && tPage > curPage) ? 1 : -1;
    const tp = pagesOf(tCh);
    tPage = Math.max(0, Math.min(tp.length - 1, tPage));
    incoming.innerHTML = renderPage(tp[tPage] || "", tPage+1, tp.length, chapters[tCh].title, globalNo(tCh, tPage), tPage===0, tCh, tPage, tp.firstH);
    paintPage(incoming);
    incoming.style.transition="none"; visible.style.transition="none";

    if(dir > 0){
      // 下一页（右半屏）：当前页向左掀走，露出底下的下一页 —— 揭示式，贴合真实翻书
      incoming.style.zIndex = 1;   // 下一页在底层、静止
      visible.style.zIndex  = 2;   // 当前页在上层、向左滑走
      incoming.style.transform = "translateX(0)";
      visible.style.transform  = "translateX(0)";
    } else {
      // 上一页（左半屏）：上一页从左边滑入，盖住当前页 —— 覆盖式
      incoming.style.zIndex = 2;   // 上一页在上层、从左边滑入
      visible.style.zIndex  = 1;   // 当前页在底层、静止
      incoming.style.transform = "translateX(-100%)";
      visible.style.transform  = "translateX(0)";
    }
    void incoming.offsetWidth; // 强制回流
    animating = true;
    // 上层页右缘窄阴影：滑动中勾出纸张边缘，与下面一页区分
    markTopEdge(dir > 0 ? visible : incoming);

    if(dir > 0){
      visible.style.transition = "transform .32s ease";
      visible.style.transform  = "translateX(-100%)";
    } else {
      incoming.style.transition = "transform .32s ease";
      incoming.style.transform  = "translateX(0)";
    }

    setTimeout(()=>{
      // 交换层级角色：目标页成为当前可见页
      topLayer = incoming; botLayer = visible;
      incoming.style.transition="none"; incoming.style.transform="translateX(0)"; incoming.style.zIndex=2;
      visible.style.transition="none";  visible.style.transform="translateX(0)";  visible.style.zIndex=1;
      clearTopEdge();
      curChapter = tCh; curPage = tPage;
      markToc(tCh);        // 翻页跨章时同步目录高亮（否则打开目录会定位到上一次的章节）
      pgSync();            // 顺带同步菜单里的整书进度条
      animating = false;
      saveProgress();
      schedulePreload();   // 落位后接着预载下一章
    }, 330);
  }

  // 边界提示语（整书首/末页）
  let boundaryTimer = null;
  function showBoundary(msg){
    const t = document.getElementById("boundaryToast");
    if(!t) return;
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(boundaryTimer);
    boundaryTimer = setTimeout(()=>t.classList.remove("show"), 1200);
  }

  // ---------- 滑动翻页：手指实时跟随，松手复用点击翻页动画 ----------
  let drag = null;        // 拖动状态对象
  let justDragged = false; // 抑制拖动后误触发的 click

  // 取某章的分页数组；缺失/为空时补一个空占位页，杜绝 bookPages[ch][0] 抛错把翻页链打断
  function pagesOf(ch){
    if(!bookPages[ch] || !bookPages[ch].length) bookPages[ch] = [""];
    return bookPages[ch];
  }

  function dragBegin(dir){
    const r = stage.getBoundingClientRect();
    const W = r.width;
    const visible = topLayer, incoming = botLayer;
    // 计算目标页（带跨章与整书边界）
    const curPages = pagesOf(curChapter);
    let tCh = curChapter, tPage = curPage + dir, blocked = false, blockedMsg = null;
    if(tPage >= curPages.length){
      // 全书最后一页：原地提示，不循环回第一章（和第一页的处理对称）
      if(tCh + 1 >= chapters.length){ blocked = true; blockedMsg = "已经是最后一页了"; }
      else { tCh++; tPage = 0; }
    } else if(tPage < 0){
      if(tCh - 1 < 0){ blocked = true; blockedMsg = "已经是第一页了"; }
      else { tCh--; tPage = pagesOf(tCh).length - 1; }
    }
    // 滑动跨章进入未加载章节：先后台补载，本次滑动按边界弹回（补载完成后再滑即可正常翻页）
    if(!blocked && !ensureNavigable(tCh)){
      blocked = true; blockedMsg = null;   // 静默等待补载，不误报「最后一页」
      const targetCh = tCh, targetDir = dir;
      loadWindowAndPaginate(currentBook, tCh).then(()=>{
        // 补载完成后手指若还按着，允许本次滑动直接继续跟手
        if(drag && drag.active && drag.pendingLoad && drag.dir === targetDir){ dragBegin(targetDir); }
      }).catch(()=>{});
    }
    if(!blocked && chapters[tCh]){
      const tp = pagesOf(tCh);
      const pi = Math.max(0, Math.min(tp.length - 1, tPage));
      incoming.innerHTML = renderPage(tp[pi]||"", pi+1, tp.length, chapters[tCh].title, globalNo(tCh,pi), pi===0, tCh, pi, tp.firstH);
      paintPage(incoming);
      tPage = pi;
    }
    incoming.style.transition="none"; visible.style.transition="none";
    if(dir > 0){            // 下一页：当前页在上随手指左移，下一页在下静止
      incoming.style.zIndex = 1; incoming.style.transform = "translateX(0)";
      visible.style.zIndex  = 2; visible.style.transform  = "translateX(0)";
    } else {                // 上一页：上一页在上，从左边随手指右移
      incoming.style.zIndex = 2; incoming.style.transform = "translateX(-100%)";
      visible.style.zIndex  = 1; visible.style.transform  = "translateX(0)";
    }
    void incoming.offsetWidth; // 强制回流
    // ⚠ 就地更新已有的 drag 对象（不能整体重建）：
    // 重建会丢掉 startX/startY/pointerId，之后每个 pointermove 算出的 dx 都变 NaN，
    // 页面只跟手一下就被卡住 —— 这正是「右滑划不动、左滑划一下就卡」的根因。
    drag.active = true;
    drag.dir = dir;
    drag.W = W;
    drag.visible = visible;
    drag.incoming = incoming;
    drag.blocked = blocked;
    drag.blockedMsg = blockedMsg;
    drag.pendingLoad = blocked && blockedMsg === null;
    drag.tCh = tCh;
    drag.tPage = tPage;
    drag.dx = 0;
    drag.moved = false;
    // 此刻在上面的那一页加右缘窄阴影，与下面的页拉开层次
    markTopEdge(dir > 0 ? visible : incoming);
  }

  stage.addEventListener("pointerdown", e=>{
    justDragged = false;
    if(animating) return;
    if(menu.classList.contains("show")) return;
    if(e.pointerType==="mouse" && e.button!==0) return;
    if(drag && drag.active) return;
    drag = { active:false, dir:0, W:0, dx:0, startX:e.clientX, startY:e.clientY,
             moved:false, pointerId:e.pointerId, t0:Date.now(), blocked:false, blockedMsg:null, pendingLoad:false, consumed:false };
  });

  stage.addEventListener("pointermove", e=>{
    if(!drag || animating) return;
    // 只认发起手势的那根手指，避免多指时坐标乱跳
    if(drag.pointerId !== undefined && e.pointerId !== drag.pointerId) return;
    if(typeof drag.startX !== "number") return;
    const dx = e.clientX - drag.startX;
    const dy = e.clientY - drag.startY;
    if(drag.consumed) return;
    if(!drag.active){
      // 尚未形成明确的水平意图（阈值 10px 且横向大于纵向）
      if(Math.abs(dx) < 10 || Math.abs(dx) <= Math.abs(dy)) return;
      drag.dir = dx < 0 ? 1 : -1;   // 左滑 = 下一页(+1)，右滑 = 上一页(-1)
      try{ stage.setPointerCapture(drag.pointerId); }catch(_){}
      dragBegin(drag.dir);
    }
    if(!drag.active) return;
    const W = drag.W;
    if(drag.blocked){
      // 边界（整书首/末页）：当前页做橡皮筋阻尼，松手弹回
      const t = Math.max(-60, Math.min(60, dx * 0.3));
      drag.visible.style.transform = `translateX(${t}px)`;
      drag.dx = dx; drag.moved = true;
      if(e.cancelable) e.preventDefault();
      return;
    }
    let t;
    if(drag.dir > 0){          // 下一页：当前页随手指左移，clamp[-W,0]
      t = Math.max(-W, Math.min(0, dx));
      drag.visible.style.transform = `translateX(${t}px)`;
    } else {                   // 上一页：上一页从左侧随手指右移，clamp[-W,0]
      t = Math.max(-W, Math.min(0, -W + dx));
      drag.incoming.style.transform = `translateX(${t}px)`;
    }
    drag.dx = dx; drag.moved = true;
    if(e.cancelable) e.preventDefault();
  });

  stage.addEventListener("pointerup", e=>{
    if(drag && drag.pointerId !== undefined && e.pointerId !== drag.pointerId) return;
    endDrag(false);
  });
  stage.addEventListener("pointercancel", e=>{
    if(drag && drag.pointerId !== undefined && e.pointerId !== drag.pointerId) return;
    endDrag(true);
  });
  // 鼠标拖出窗口后松手（pointerup 可能收不到）：兜底收尾
  window.addEventListener("pointerup", e=>{
    if(!drag || !drag.active) return;
    if(drag.pointerId !== undefined && e.pointerId !== drag.pointerId) return;
    endDrag(false);
  });

  function endDrag(cancelled){
    if(!drag) return;
    const d = drag; drag = null;
    if(!d.active) return;              // 仅点击，不拦截，交给 click 处理
    justDragged = true;
    animating = true;
    const W = d.W || 1;
    const dist = Math.abs(d.dx);
    const dt = Math.max(1, Date.now() - (d.t0 || Date.now()));
    // 划过 1/4 屏宽，或「快速轻扫」（短时间 + 少量位移）即翻页
    const committed = !cancelled && (dist > W * 0.22 || (dist > W * 0.08 && dt < 300));

    const finish = ()=>{
      clearTopEdge();
      if(d.blocked){
        topLayer.style.transition="none"; topLayer.style.transform="translateX(0)"; topLayer.style.zIndex=2;
        botLayer.style.transition="none"; botLayer.style.transform="translateX(0)"; botLayer.style.zIndex=1;
        animating=false;
        if(committed && d.blockedMsg){
          showBoundary(d.blockedMsg);
          stage.classList.remove("shake"); void stage.offsetWidth; stage.classList.add("shake");
        }
        return;
      }
      if(committed){
        topLayer = d.incoming; botLayer = d.visible;
        curChapter = d.tCh; curPage = d.tPage;
        markToc(d.tCh);    // 滑动翻页跨章时同样要同步目录高亮
        pgSync();
      }
      topLayer.style.transition="none"; topLayer.style.transform="translateX(0)"; topLayer.style.zIndex=2;
      botLayer.style.transition="none"; botLayer.style.transform="translateX(0)"; botLayer.style.zIndex=1;
      animating=false;
      if(committed) saveProgress();
    };

    if(d.blocked){
      d.visible.style.transition="transform .32s ease";
      d.visible.style.transform="translateX(0)";
      setTimeout(finish, 330); return;
    }
    if(d.dir > 0){    // 完成=当前页滑到 -100%；弹回=回到 0
      d.visible.style.transition="transform .32s ease";
      d.incoming.style.transition="none"; d.incoming.style.transform="translateX(0)";
      d.visible.style.transform = committed ? "translateX(-100%)" : "translateX(0)";
    } else {          // 完成=上一页滑到 0；弹回=回到 -100%
      d.incoming.style.transition="transform .32s ease";
      d.visible.style.transition="none"; d.visible.style.transform="translateX(0)";
      d.incoming.style.transform = committed ? "translateX(0)" : "translateX(-100%)";
    }
    setTimeout(finish, 330);
  }

  // ---------- 整书进度滑动条（自绘，嵌在「进度」二级菜单里） ----------
  const pgSlider    = document.getElementById("pgSlider");
  const pgRail      = document.getElementById("pgRail");
  const pgFill      = document.getElementById("pgFill");
  const pgThumb     = document.getElementById("pgThumb");
  const pgMetaCh    = document.getElementById("pgMetaCh");
  const pgMetaPct   = document.getElementById("pgMetaPct");
  let pgDrag  = null;   // 拖动中的指针状态

  // 给定整书百分比 → 最接近的章节（拖动时的章节名 + 松手落点）
  // 导入书正文是懒加载的（未载入的章只有 1 页占位），页数比例不可靠，改用目录行号区间估算；
  // 整书已全部分页的书，直接按各章页数累计定位。
  function seekInfoAt(pct){
    pct = Math.max(0, Math.min(100, pct));
    const totalCh = (chapters && chapters.length) || 1;
    const toc = currentBook && currentBook.toc;
    if(toc && toc.length){
      const totalLines = Math.max(1, toc[toc.length-1].end || 1);
      const target = totalLines * pct / 100;
      let ci = 0;
      for(let i=0;i<toc.length;i++){ if(toc[i].start <= target) ci = i; else break; }
      ci = Math.max(0, Math.min(totalCh-1, ci));
      return { ci, label: (toc[ci] && toc[ci].title) || ("第 "+(ci+1)+" 章"),
               byLine:true, target, totalLines, pageIn:0 };
    }
    const all = bookPages.reduce((a,ps)=>a + (ps ? ps.length : 0), 0) || 1;
    const targetPage = Math.round(all * pct / 100);
    let acc = 0, ci = 0, pageIn = 0;
    for(let i=0;i<bookPages.length;i++){
      const n = bookPages[i] ? bookPages[i].length : 0;
      if(!n) continue;
      if(acc + n >= targetPage){ ci = i; pageIn = Math.max(0, Math.min(n-1, targetPage - acc)); break; }
      acc += n; ci = i;
    }
    return { ci, label: (chapters[ci] && chapters[ci].title) || ("第 "+(ci+1)+" 章"),
             byLine:false, pageIn };
  }

  // 把百分比画到轨道上；拖动中下方文字跟着目标章节走，松手后回到「当前章」
  function pgApply(pct, dragging){
    pct = Math.max(0, Math.min(100, pct));
    pgFill.style.width = pct + "%";
    pgThumb.style.left = pct + "%";
    const info = seekInfoAt(pct);
    const cur = dragging ? info.label : (((chapters && chapters[curChapter]) || {}).title || info.label);
    pgMetaCh.textContent  = cur;
    pgMetaPct.textContent = Math.round(pct) + "%";
  }

  // 翻页 / 跳章 / 换主题后同步一次（面板没打开时只是更新数值，看不见也无所谓）
  function pgSync(){
    if(!pgSlider || !currentBook) return;
    pgApply(wholeBookPercent(curChapter, curPage), !!pgDrag);
  }

  // 松手：先补载目标章正文，再跳到该位置
  async function pgCommit(pct){
    if(!currentBook) return;
    const info = seekInfoAt(pct);
    const ci = Math.max(0, Math.min(chapters.length-1, info.ci));
    if(currentBook.imported && !ensureNavigable(ci)){
      try{ await loadWindowAndPaginate(currentBook, ci); }catch(e){}
    }
    if(!bookPages[ci] || !bookPages[ci].length) bookPages[ci] = [""];
    const ps = bookPages[ci];
    let pg = 0;
    if(info.byLine){
      const toc = currentBook.toc, cur = toc[ci], next = toc[ci+1];
      const segStart = cur.start;
      const segEnd   = next ? next.start : (cur.end || info.totalLines);
      const segLen   = Math.max(1, segEnd - segStart);
      const ratio    = Math.max(0, Math.min(1, (info.target - segStart) / segLen));
      pg = Math.floor(ratio * ps.length);
    } else {
      pg = info.pageIn;
    }
    pg = Math.max(0, Math.min(ps.length-1, pg));
    curChapter = ci; curPage = pg;
    renderCurrent();
    saveProgress();
  }

  function pgPctAt(clientX){
    const r = pgRail.getBoundingClientRect();
    if(!r.width) return 0;
    return Math.max(0, Math.min(100, (clientX - r.left) / r.width * 100));
  }

  pgSlider.addEventListener("pointerdown", e=>{
    if(!currentBook) return;
    if(e.pointerType === "mouse" && e.button !== 0) return;
    e.preventDefault(); e.stopPropagation();
    pgDrag = { id: e.pointerId };
    pgSlider.classList.add("dragging");
    try{ pgSlider.setPointerCapture(e.pointerId); }catch(_){}
    pgApply(pgPctAt(e.clientX), true);
  });

  pgSlider.addEventListener("pointermove", e=>{
    if(!pgDrag || e.pointerId !== pgDrag.id) return;
    if(e.cancelable) e.preventDefault();
    pgApply(pgPctAt(e.clientX), true);
  });

  function pgEndDrag(e, cancelled){
    if(!pgDrag) return;
    if(e && e.pointerId !== undefined && e.pointerId !== pgDrag.id) return;
    pgDrag = null;
    pgSlider.classList.remove("dragging");
    if(cancelled){ pgSync(); return; }
    const pct = parseFloat(pgFill.style.width) || 0;
    pgCommit(pct);      // renderCurrent 内部会 pgSync，松手后数值回到精确位置
  }
  pgSlider.addEventListener("pointerup", e=>pgEndDrag(e, false));
  pgSlider.addEventListener("pointercancel", e=>pgEndDrag(e, true));

  // 中点=开菜单；左半屏=上一页，右半屏=下一页（点按保留）
  stage.addEventListener("click", e=>{
    if(justDragged){ justDragged=false; return; }
    if(animating) return;
    if(menu.classList.contains("show")) return;
    const r = stage.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    const cx = r.width/2, cy = r.height/2;
    // 屏幕正中央一块区域（约 44% 宽 × 40% 高）单点开菜单
    if(Math.abs(x-cx) < r.width*0.22 && Math.abs(y-cy) < r.height*0.20){
      openMenu(); return;
    }
    if(x < cx) flip(-1); else flip(1);
  });

  // ---------- 分段解析：导入书正文按需切片 ----------
  // 导入书首次打开 → 全文切出「目录」并固定保存（LS_TOC）；此后打开 → 复用目录，
  // 仅对「当前章 ± 附近窗口」做正文切片（sliceBodyAsync），解析范围随阅读进度向前推进，
  // 避免每次都对整本书全文正则切分导致卡顿。
  const LAZY_WINDOW = 1;   // 当前章前后各预载 1 章

  // 确保导入书已有目录（无则全文切一次并落盘），返回 [{title,start,end}]
  async function ensureToc(book){
    if(book.toc && book.toc.length) return book.toc;
    const toc = await parseTocAsync(book.text);
    if(!toc || !toc.length){
      // 兜底：解析不出目录时，至少给一个「正文」单章，保证能进阅读页
      const fallback = [{ title:"正文", start:0, end:Number.MAX_SAFE_INTEGER }];
      book.toc = fallback;
      tocStore[book.id] = fallback;
      persist();
      return fallback;
    }
    book.toc = toc;
    tocStore[book.id] = toc;
    persist();
    return toc;
  }

  // 把导入书 chapters 数组按目录重建为「标题齐全、正文空」的骨架（长度=章节数，供分页/目录用）
  function buildChapterSkeleton(book){
    const toc = book.toc || [];
    const arr = toc.map(t => ({ title: t.title, body: [], level: t.level || 0 }));
    book.chapters = arr;
    return arr;
  }

  // 惰性载入某章正文（幂等：已加载则跳过；并发调用共用同一个 Promise，不会切两遍）
  const chapterLoading = new Map();   // `${bookId}|${ci}` → Promise
  async function ensureChapterBody(book, ci){
    const chs = book.chapters;
    if(!chs || !chs[ci]) return;
    if(chs[ci].body && chs[ci].body.length) return;   // 已加载
    const key = book.id + "|" + ci;
    if(chapterLoading.has(key)){ await chapterLoading.get(key); return; }
    const job = (async ()=>{
      const toc = book.toc;
      let body;
      if(toc && toc[ci]){
        const s = toc[ci];
        body = await sliceBodyAsync(book, s.start, s.end);
      } else {
        // 目录缺失/异常时的兜底：整章取全文（保证内容绝不因 toc 缺失而丢失）
        body = await sliceBodyAsync(book, 0, Number.MAX_SAFE_INTEGER);
      }
      chs[ci].body = body.length ? body : [""];
    })();
    chapterLoading.set(key, job);
    try { await job; } finally { chapterLoading.delete(key); }
  }

  // 载入「当前章 ± 窗口」的正文，随后只补这些新章的分页
  async function loadWindowAndPaginate(book, ci){
    const chs = book.chapters;
    for(let k = ci - LAZY_WINDOW; k <= ci + LAZY_WINDOW; k++){
      if(k >= 0 && k < chs.length) await ensureChapterBody(book, k);
    }
    // 等待一帧，确保阅读舞台已布局（stage.clientWidth/Height 有效），否则分页会退回整章一页
    await new Promise(r=>requestAnimationFrame(()=>r()));
    // 只补新载入的章（不是全书、也不是所有已读章），代价恒定
    paginateMissing();
  }

  // ---------- 预载：把下一章提前切好并分页，翻到章末时零等待 ----------
  // 动机：正文是按章懒切的，翻到「本章最后一页再往后」时才去切下一章，
  // 那一下必然要等（切行 + 分页），读得越久越明显。现在在空闲时先把后面几章备好。
  const PRELOAD_AHEAD = 2;      // 往后预载几章；1 章就够用，2 章是为了跨章后还能再翻
  const PRELOAD_DELAY = 220;    // 停下来多久才开始预载（连续翻页时只跑最后一次）
  let preloadGen = 0;           // 阅读位置每变一次就 ++，旧任务看到 gen 变了就自己退出
  let preloadBusy = false;

  function schedulePreload(){
    const gen = ++preloadGen;
    if(!currentBook || !currentBook.imported) return;
    setTimeout(()=>{ if(gen === preloadGen) runPreload(gen); }, PRELOAD_DELAY);
  }

  async function runPreload(gen){
    if(preloadBusy) return;
    const book = currentBook;
    if(!book || !book.imported || !book.chapters) return;
    // 不在阅读页 / 舞台不可见时都不做：量不出正确尺寸，分页会被写成「整章一页」并缓存住
    const reading = document.getElementById("reading");
    if(!reading || !reading.classList.contains("active")) return;
    if(!stage.clientWidth || !stage.clientHeight) return;
    preloadBusy = true;
    try{
      const total = book.chapters.length;
      // 顺序：先往后（阅读方向），再补前一章（往回翻同样不该等）
      const queue = [];
      for(let k = curChapter + 1; k <= Math.min(total - 1, curChapter + PRELOAD_AHEAD); k++) queue.push(k);
      if(curChapter - 1 >= 0) queue.push(curChapter - 1);
      for(const k of queue){
        if(gen !== preloadGen) return;          // 位置变了，交给新任务
        if(ensureNavigable(k)) continue;        // 正文已在，跳过
        await ensureChapterBody(book, k);
        if(gen !== preloadGen) return;
        if(!animating) paginateMissing();       // 正在翻页就让开，别和动画抢主线程
        await new Promise(r=>setTimeout(r, 0)); // 每章让出一帧
      }
    }catch(e){
      // 预载失败无所谓：真翻过去时还有一次 ensureNavigable 兜底
    }finally{
      preloadBusy = false;
    }
  }

  async function openBookById(id){
    const book = getBook(id);
    if(!book) return;
    closeMenu();
    currentBook = book;
    preloadGen++;              // 换书：上一本还在跑的预载任务立刻作废，别再碰新书的 chapters
    const pr = getProgress(book);
    curBookName = book.name;
    document.getElementById("menuBook").textContent = book.name;

    if(book.imported){
      // 正文缺失（IndexedDB 读回失败/未写完）→ 明确提示，绝不静默渲染空白页
      if(!book.text || !book.text.length){
        showScreen("bookshelf"); renderShelf();
        alert("这本书的正文未能从本地存储读取（可能上次保存未完成）。请删除后重新导入。");
        return;
      }
      // —— 导入书：分段解析 ——
      try{
        await ensureToc(book);                     // 首次全文切目录（Worker）并固定保存；之后直接复用
        buildChapterSkeleton(book);                // 标题齐全、正文空骨架
        chapters = book.chapters;                  // 关键：先切到导入书，绝不停留在内置样例
        bookPages = []; allTotal = 0;              // 换书必须清掉上一本的页缓存（下标会撞车）
        preloadGen++;                              // 作废上一本书的预载任务
        buildToc();
        showScreen("reading");
        const ci = Math.min(pr.ch||0, chapters.length-1);
        curChapter = ci; curPage = pr.page || 0;
        await loadWindowAndPaginate(book, ci);     // 仅切片当前章 ± 窗口正文，再分页
        // 若当前章仍无正文（极端异常），强制同步切片兜底，保证有内容可读
        if(!chapters[curChapter] || !chapters[curChapter].body || !chapters[curChapter].body.length){
          chapters[curChapter] = { title: chapters[curChapter] ? chapters[curChapter].title : book.name,
                                   body: sliceBodySync(book.text, 0, Number.MAX_SAFE_INTEGER) };
          paginateMissing();
        }
        if(curPage >= (bookPages[curChapter]||[]).length) curPage = 0;
        renderCurrent();
        saveProgress();
      }catch(err){
        // 解析失败也绝不回退到默认样例：给空内容兜底并提示
        chapters = [{ title: book.name, body: [ book.text || "（未能读取到书籍内容）" ] }];
        buildToc();
        showScreen("reading");
        curChapter = 0; curPage = 0;
        paginateBook();
        renderCurrent();
        saveProgress();
      }
    } else {
      // —— 内置书：完整章节，直接分页 ——
      chapters = book.chapters;
      buildToc();
      showScreen("reading");
      curChapter = Math.min(pr.ch||0, chapters.length-1);
      curPage = pr.page || 0;
      requestAnimationFrame(()=>{
        paginateBook();
        if(curPage >= (bookPages[curChapter]||[]).length) curPage = 0;
        renderCurrent();
        saveProgress();
      });
    }
  }

  // 翻页/跳章前检查目标章正文是否已就绪（导入书懒加载用）
  function ensureNavigable(tCh){
    if(!currentBook || !currentBook.imported) return true;
    const chs = currentBook.chapters;
    if(!chs || !chs[tCh]) return true;
    return !!(chs[tCh].body && chs[tCh].body.length);
  }

  // ---------- 目录 ----------
  const tocList = document.getElementById("tocList");
  function buildToc(){
    tocList.innerHTML = "";
    chapters.forEach((c,i)=>{
      const it=document.createElement("div");
      it.className="toc-item"; it.textContent=c.title;
      // EPUB 目录带层级（卷 → 章）：子条目缩进一档 + 字号小一号，只做视觉提示，点击行为不变
      const lv = c.level || 0;
      if(lv > 0){
        it.style.setProperty("--toc-ind", (Math.min(lv, 3) * 14) + "px");
        it.style.fontSize = Math.max(12, 14 - lv) + "px";
      }
      it.addEventListener("click",()=>{ gotoChapter(i); });
      tocList.appendChild(it);
    });
    tocGripRender();
  }
  function markToc(ci){
    tocList.querySelectorAll(".toc-item").forEach((it,i)=> it.classList.toggle("on", i===ci));
  }

  // ---------- 目录专用滚动把手（浮在右边缘，收起时大半缩进边里；点按 / 拖动可快速定位） ----------
  const tocEl     = document.getElementById("toc");
  const tocGripEl = document.getElementById("tocGrip");
  const TOC_GRIP_IDLE = 1300;            // 停手多久之后缩回去（ms）
  let tocGripTimer = 0, tocGripDrag = null, tocGripGeo = null;
  let tocGripMute = false, tocGripMuteTimer = 0;   // 打开目录时的「自动定位滚动」不算用户操作

  function tocGripMeasure(){
    const track = tocList.clientHeight;
    const total = tocList.scrollHeight;
    if(!track || total - track <= 1) return null;       // 不足一屏，不出现
    const pad = 4, inner = Math.max(1, track - pad * 2);
    const ratio = Math.max(0.05, Math.min(1, track / Math.max(1, total)));
    return { track, pad, inner, max: total - track, h: Math.max(44, Math.round(inner * ratio)) };
  }

  function tocGripRender(){
    const g = tocGripMeasure();
    if(!g){ tocGripGeo = null; tocGripEl.style.display = "none"; return; }
    tocGripGeo = g;
    tocGripEl.style.display = "";
    const p = Math.max(0, Math.min(1, tocList.scrollTop / g.max));
    tocGripEl.style.height = g.h + "px";
    tocGripEl.style.top    = Math.round(g.pad + (g.inner - g.h) * p) + "px";
  }

  function tocGripShow(){
    tocEl.classList.add("grip-out");
    clearTimeout(tocGripTimer);
    if(tocGripDrag) return;                            // 拖动中不收
    tocGripTimer = setTimeout(()=>{ if(!tocGripDrag) tocEl.classList.remove("grip-out"); }, TOC_GRIP_IDLE);
  }

  function tocGripHide(){
    clearTimeout(tocGripTimer);
    clearTimeout(tocGripMuteTimer);
    tocGripMute = false;
    tocGripDrag = null; tocGripGeo = null;
    tocEl.classList.remove("grip-out");
  }

  tocList.addEventListener("scroll", ()=>{
    if(!tocEl.classList.contains("show")) return;
    tocGripRender();
    if(tocGripMute) return;            // 刚打开时的定位滚动：只更新位置，不弹把手
    tocGripShow();
  }, { passive:true });

  tocGripEl.addEventListener("pointerdown", e=>{
    if(!tocGripGeo) return;
    e.preventDefault(); e.stopPropagation();
    tocGripDrag = { y:e.clientY, top:tocList.scrollTop };
    tocEl.classList.add("grip-out");
    clearTimeout(tocGripTimer);
    try{ tocGripEl.setPointerCapture(e.pointerId); }catch(_){}
  });
  tocGripEl.addEventListener("pointermove", e=>{
    if(!tocGripDrag || !tocGripGeo) return;
    e.preventDefault();
    const g = tocGripGeo, span = Math.max(1, g.inner - g.h);
    const next = tocGripDrag.top + ((e.clientY - tocGripDrag.y) / span) * g.max;
    tocList.scrollTop = Math.max(0, Math.min(g.max, next));
    tocGripRender();
  });
  function tocGripEnd(){
    if(!tocGripDrag) return;
    tocGripDrag = null;
    tocGripShow();                                     // 松手后延时缩回
  }
  tocGripEl.addEventListener("pointerup", tocGripEnd);
  tocGripEl.addEventListener("pointercancel", tocGripEnd);

  // ---------- 主题应用 ----------
  const swatchBox = document.getElementById("swatches");
  Object.keys(themes).forEach(k=>{
    const s=document.createElement("div");
    s.className="swatch"+(k===curTheme?" on":"");
    s.style.background=themes[k].swatch;
    s.title=themes[k].name;
    s.addEventListener("click",()=>applyTheme(k));
    swatchBox.appendChild(s);
  });
  // 真机系统状态栏 / 地址栏着色：让状态栏背景跟着当前页面底色走，读起来像原生
  function syncThemeColor(bg){
    const m = document.querySelector('meta[name="theme-color"]');
    if(m) m.setAttribute("content", bg || "#EFE6CE");
  }

  function applyTheme(k){
    curTheme=k; const t=themes[k];
    syncThemeColor(t.bg);
    const r=document.getElementById("reading");
    r.style.backgroundColor=t.bg;
    // 纸纹主题用真实纸纹图作 image fill；其余主题素底。翻页时底色+纸纹随页一起滑动
    const tex = (k==="paper"||k==="sepia") ? `url("${PAPER_TEX}")` : "none";
    r.style.backgroundImage = tex;
    document.querySelectorAll(".reader-page").forEach(p=>paintPage(p));
    // 菜单 / 二级菜单 / 目录 背景与阅读页基本一致，纯色
    const tb=document.querySelector("#menu .top-bar"), bp=document.getElementById("bottomPanel"), sp=document.getElementById("subPanel"), toc=document.getElementById("toc");
    [tb,bp,sp,toc].forEach(el=>{ if(el) el.style.background=t.bg; });
    if(toc) toc.classList.toggle("dark", k==="black");   // 目录把手在深底上换浅色
    // 目录滚动把手的实色：比纸底浅一档，收起 / 探出同色（不透明，避免叠在不同底色上变色）
    if(toc) toc.style.setProperty("--grip-bg", t.grip);
    tb.style.color=t.title; bp.style.color=t.status; sp.style.color=t.status;
    document.querySelector("#toc .toc-head").style.color=t.title;
    document.querySelector("#toc .toc-close").style.color=t.status;
    document.querySelectorAll("#toc .toc-item").forEach(it=>{ it.style.color=t.text; it.style.borderBottomColor=hexToRgba(t.status,.14); });
    document.querySelectorAll("#menu .divider").forEach(d=>d.style.background=hexToRgba(t.status,.14));
    // 进度滑动条 / 亮度滑条 随主题取色（轨道深浅、把手内芯取页面底色）
    const railCol = (k==="black") ? "rgba(255,255,255,.20)" : "rgba(90,70,45,.16)";
    const brightEl = document.getElementById("bright");
    brightEl.style.accentColor = t.title;
    [pgSlider, brightEl].forEach(el=>{
      if(!el) return;
      el.style.setProperty("--pgc", t.title);
      el.style.setProperty("--pg-rail", railCol);
      el.style.setProperty("--pg-bg", t.bg);
    });
    document.querySelectorAll("#swatches .swatch").forEach((s,idx)=>{ const on=Object.keys(themes)[idx]===k; s.classList.toggle("on",on); s.style.borderColor=on?t.title:"transparent"; });
    persist();   // 主题切换也记入本地设置
  }

  // ---------- 字号 ----------
  const FONT_MIN = 14, FONT_MAX = 26;
  const fontRangeEl = document.getElementById("fontRange");
  const fontSizeEl  = document.getElementById("fontSize");
  const fontHintEl  = document.getElementById("fontHint");

  // 只改样式与标签，不重排（拖动滑条时每帧都跑一遍重排会卡）
  function paintFont(){
    // 正文实际字号：.reader-page 用 var(--rp-fs) 取值，才能盖过它自己的默认字号
    stage.style.fontSize = fontPx+"px";
    stage.style.setProperty("--rp-fs", fontPx+"px");
    meas.style.fontSize = fontPx+"px";
    meas.style.setProperty("--rp-fs", fontPx+"px");
    stage.style.setProperty("--rp-line", (fontPx*1.5)+"px");   // 行高，页脚留白按它的 1.5 倍算
    fontSizeEl.textContent = fontPx;
    fontHintEl.textContent = fontPx<=16 ? "小" : fontPx<=19 ? "标准" : fontPx<=22 ? "大" : "特大";
    if(fontRangeEl && Number(fontRangeEl.value) !== fontPx) fontRangeEl.value = fontPx;
    document.getElementById("fontMinus").disabled = fontPx <= FONT_MIN;
    document.getElementById("fontPlus").disabled  = fontPx >= FONT_MAX;
    document.getElementById("fontMinus").style.opacity = fontPx <= FONT_MIN ? ".3" : "";
    document.getElementById("fontPlus").style.opacity  = fontPx >= FONT_MAX ? ".3" : "";
  }

  // 改字号并重排：保留当前章内的相对阅读位置
  function updateFont(){
    paintFont();
    if(bookPages.length){
      const curTotal = bookPages[curChapter].length || 1;
      const ratio = (curPage+0.5)/curTotal;
      paginateLoadedChapters();
      const nt = bookPages[curChapter].length || 1;
      curPage = Math.min(nt-1, Math.max(0, Math.floor(ratio*nt)));
      renderCurrent();
      saveProgress();   // 重排后的页码已经变了，读到的位置要跟着落盘（saveProgress 内部也会 persist 字号设置）
    } else {
      persist();
    }
  }

  function stepFont(delta){
    fontPx = Math.min(FONT_MAX, Math.max(FONT_MIN, fontPx + delta));
    updateFont();
  }
  document.getElementById("fontPlus").addEventListener("click",()=>stepFont(1));
  document.getElementById("fontMinus").addEventListener("click",()=>stepFont(-1));
  // 滑条：拖动中只改字号显示（阅读页被菜单挡着，看不见），松手才重排，避免连续重排卡顿
  fontRangeEl.addEventListener("input", e=>{
    fontPx = Math.min(FONT_MAX, Math.max(FONT_MIN, Number(e.target.value)));
    paintFont();
  });
  fontRangeEl.addEventListener("change", ()=>{ updateFont(); });

  // ---------- 亮度 ----------
  // 滑条表示的是「亮度」：最左 0 = 最暗，最右 60 = 最亮（不遮罩）。
  // 早先存的是「遮罩深浅」，0 在最左却对应最亮，往右拖反而越暗 —— 方向和两侧图标是反的。
  function dimOpacity(v){ return ((BRIGHT_MAX - v) / 100).toFixed(2); }
  function applyBright(){
    const el = document.getElementById("bright");
    if(el && Number(el.value) !== brightVal) el.value = brightVal;
    document.getElementById("dimmer").style.opacity = dimOpacity(brightVal);
  }
  document.getElementById("bright").addEventListener("input",e=>{
    brightVal = Number(e.target.value);
    document.getElementById("dimmer").style.opacity = dimOpacity(brightVal);
    persist();
  });

  // ---------- 菜单 ----------
  const menu=document.getElementById("menu");
  const subPanel=document.getElementById("subPanel");
  const subTitle=document.getElementById("subTitle");
  const SUB_TITLES={font:"字号", pg:"进度", bright:"亮度", set:"设置"};

  // 二级面板是绝对定位、靠自身 translateY 上滑来覆盖一级图标行。
  // 父面板（.bottom-panel）高度只按图标行算，且 overflow:visible ——
  // 所以二级面板比图标行高时会自然向上延伸出去，父级一点不动。
  // 早先那套「把父面板 minHeight 撑到二级面板高度」的做法已经废弃：
  // 那是两次离散的高度跳变，点一下菜单会先猛地弹高一截，非常难看。

  function openMenu(){
    menu.classList.add("show");
  }
  function closeMenu(){
    menu.classList.remove("show");
    closeToc(); subPanel.classList.remove("show");
  }
  document.getElementById("menuScrim").addEventListener("click",closeMenu);
  document.getElementById("menuBack").addEventListener("click",()=>{ closeMenu(); renderShelf(); showScreen("bookshelf"); });

  // 一级菜单：单行图标；目录→侧栏，其余→二级菜单（每个图标对应一块 sub-sec）
  document.querySelectorAll("#menuIcons .mi").forEach(mi=>{
    mi.addEventListener("click",()=>{
      const act=mi.dataset.act;
      if(act==="toc"){ openToc(); return; }
      subTitle.textContent = SUB_TITLES[act] || "设置";
      document.querySelectorAll("#subPanel .sub-sec").forEach(s=>s.classList.toggle("active", s.dataset.sec===act));
      subPanel.classList.add("show");
      if(act==="pg") pgSync();   // 打开进度面板时先刷一次当前进度
    });
  });
  document.getElementById("subBack").addEventListener("click",()=>{ subPanel.classList.remove("show"); });

  // 目录开关：每次打开都定位到当前正在读的章节（放在列表约 1/3 高处，前后都留上下文）
  function openToc(){
    tocEl.classList.add("show");
    // 打开时把手保持收起（默认隐藏），只跟着定位到正确位置
    tocGripMute = true;
    clearTimeout(tocGripMuteTimer);
    tocGripMuteTimer = setTimeout(()=>{ tocGripMute = false; }, 320);
    scrollTocToCurrent();
    tocGripRender();
  }
  function scrollTocToCurrent(){
    const it = tocList.querySelector(".toc-item.on");
    if(!it) return;
    const h = tocList.clientHeight;
    if(!h) return;
    // 用 rect 差值定位，避开 offsetParent 的层级差异
    const delta = it.getBoundingClientRect().top - tocList.getBoundingClientRect().top;
    const target = tocList.scrollTop + delta - h * 0.32;
    const max = Math.max(0, tocList.scrollHeight - h);
    tocList.scrollTop = Math.max(0, Math.min(target, max));
  }
  function closeToc(){ tocEl.classList.remove("show"); csbReset(); tocGripHide(); }
  document.getElementById("tocClose").addEventListener("click",closeToc);

  // ---------- 底部导航 ----------
  document.querySelectorAll(".bottom-nav .nav-item").forEach(it=>{
    it.addEventListener("click",()=>{
      if(it.dataset.screen === "bookshelf") renderShelf();   // 返回书架时按最近阅读重排
      showScreen(it.dataset.screen);
    });
  });

  // ---------- 导入 ----------
  const fileInput = document.getElementById("fileInput");
  const importMsg = document.getElementById("importMsg");
  fileInput.addEventListener("change", async e=>{
    const f = e.target.files && e.target.files[0];
    if(!f) return;
    const fileBase = f.name.replace(/\.(txt|epub)$/i, "");
    const isEpub = /\.epub$/i.test(f.name);
    importMsg.textContent = "正在解析《"+fileBase+"》…";
    try{
      let raw, toc, epubTitle = "", images = null;
      if(isEpub){
        // EPUB：解包 + 取书目 + 抽正文，全程在本地完成（不联网、不引库）
        const r = await parseEpub(f, m=>{ importMsg.textContent = m; });
        raw = r.text;
        toc = r.toc;
        epubTitle = r.title || "";
        images = (r.images && r.images.length) ? r.images : null;
        if(!raw || !toc || !toc.length) throw new Error("EPUB 里没有解析到正文");
      } else {
        raw = await readFileText(f);
        // 导入阶段只切目录（Worker 后台执行），正文留待打开时按需分段切片，避免全文解析阻塞
        toc = await parseTocAsync(raw);
        if(!toc || !toc.length){
          throw new Error("未能识别到任何章节，请确认文件内容");
        }
      }
      const name = (epubTitle || fileBase).replace(/\s+/g," ").trim().slice(0, 60) || fileBase;
      const id = "imp-" + Date.now();
      const book = { id, name, color: pickColor(), text: raw, imported:true, chapters: null, toc: toc, progress:null, images };
      tocStore[id] = toc;
      importedBooks.push(book);
      persist();                       // 元数据/目录/进度落盘（不含大正文）
      await persistText(book);         // 正文可靠写入 IndexedDB 并等待完成，避免关闭时未写完 → 下次空白
      renderShelf();
      updateMine();
      importMsg.textContent = "已导入《"+name+"》· 共 "+toc.length+" 章";
      fileInput.value = "";
      openBookById(id);   // 导入后直接打开阅读（此时才分段载入正文）
    }catch(err){
      importMsg.textContent = "解析失败：" + (err && err.message ? err.message : "未知错误");
      fileInput.value = "";
    }
  });

  // ---------- 我的：动态统计 ----------
  function updateMine(){
    const mineEl = document.getElementById("mineStats");
    if(!mineEl) return;
    const total = allBooks().length;
    const importedCnt = importedBooks.length;
    const reading = allBooks().filter(b=>(getProgress(b).percent||0)>0 && (getProgress(b).percent||0)<100).length;
    const finished = allBooks().filter(b=>(getProgress(b).percent||0)>=100).length;
    mineEl.querySelector(".s-total").textContent = total;
    mineEl.querySelector(".s-imp").textContent = importedCnt;
    mineEl.querySelector(".s-reading").textContent = reading;
    mineEl.querySelector(".s-finished").textContent = finished;
    // 最近阅读列表
    const list = document.getElementById("mineHistory");
    list.innerHTML = "";
    const recent = allBooks()
      .map(b=>({ b, p:getProgress(b) }))
      .filter(x=>x.p.percent>0)
      .sort((a,b)=> b.p.percent - a.p.percent)
      .slice(0,6);
    if(!recent.length){
      list.innerHTML = '<div style="font-size:12px;color:#9a8b78;padding:8px 0">还没有阅读记录，去书架挑一本书吧</div>';
    } else {
      recent.forEach(({b,p})=>{
        const row=document.createElement("div");
        row.className="mine-row";
        row.innerHTML = `<span>${b.name}</span><span>${p.percent>=100?"已读完":("已读 "+p.percent+"%")}</span>`;
        row.addEventListener("click",()=>openBookById(b.id));
        list.appendChild(row);
      });
    }
  }

  // ---------- 初始化 ----------
  // 摆位放在第一件事：loadStore 可能要读 IndexedDB / 解析导入书，等它回来再摆位的话，
  // 这段时间里三页是叠在同一位置的（首帧会看到 DOM 最靠后的「我的」页）
  applyTabOffset(true);
  syncNav(TAB_ORDER[curTab]);
  await loadStore();          // 启动回读持久化的导入书（在 Worker 里解析，不卡界面）
  renderShelf();
  updateMine();
  applyTheme(curTheme);
  applyBright();              // 亮度滑条位置与遮罩一起恢复（老数据已按 v3 换算过）
  updateFont();
  initLiveStatus();           // 启动阅读页底栏的本机时间 / 电量实时刷新
})();
</script>

<script>
/* ===== 系统状态栏联动（只在原生壳里生效；浏览器里 window.NativeBars 不存在，纯空转） =====
   规则：只有「阅读页 active 且菜单、目录都没展开」才算沉浸式，其余一律要状态栏。
   主页面（书架/导入/我的）和菜单态都必须让系统栏可见 —— 顶栏和底栏都是浅色纸底，
   一条状态栏挂在上面对应真实应用；纯阅读时则藏起来，页脚自己画电量与时间。

   这里用 MutationObserver 盯 class 而不是在各个开关里插钩子：
   菜单/目录的显隐路径很多（点遮罩、返回键、把手、切换屏幕……），逐个挂钩必漏一个。 */
(function(){
  var last = null;

  function isReadingImmersive(){
    var r = document.getElementById("reading");
    if(!r || !r.classList.contains("active")) return false;   // 主页面：显示状态栏
    var m = document.getElementById("menu");
    if(m && m.classList.contains("show")) return false;        // 菜单展开：显示状态栏
    var t = document.getElementById("toc");
    if(t && t.classList.contains("show")) return false;        // 目录展开：显示状态栏
    return true;
  }

  function push(){
    var immersive = isReadingImmersive();
    if(immersive === last) return;      // 状态没变就别反复下发，省得系统栏闪
    last = immersive;
    try{
      if(window.NativeBars && window.NativeBars.setImmersive){
        window.NativeBars.setImmersive(immersive);
      }
    }catch(e){ /* 桥接不可用就当时浏览器跑，什么都不做 */ }
  }

  // showScreen 会先 remove 再 add class，一次切换触发两轮回调；合并成一次再推。
  // 不用 requestAnimationFrame：页面切到后台、或 WebView 被挂起时 rAF 根本不跑，
  // 一旦用它做唯一的触发点，状态就永远推不出去（headless 里也是这个表现）。
  var queued = false;
  function schedule(){
    if(queued) return;
    queued = true;
    setTimeout(function(){
      if(!queued) return;
      queued = false;
      push();
    }, 0);
  }

  function watch(id){
    var el = document.getElementById(id);
    if(!el) return;
    new MutationObserver(schedule).observe(el, { attributes:true, attributeFilter:["class"] });
  }

  // 从后台回来时系统会把状态栏放回去，所以要强制重推一次（清掉 last）
  function forcePush(){ last = null; schedule(); }

  ["reading", "menu", "toc"].forEach(watch);
  document.addEventListener("DOMContentLoaded", forcePush);
  window.addEventListener("load", forcePush);
  document.addEventListener("visibilitychange", function(){ if(!document.hidden) forcePush(); });
  forcePush();
})();
</script>
