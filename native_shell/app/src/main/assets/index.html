<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>小说阅读器 · 网页原型</title>
<!-- 真机系统状态栏 / 地址栏跟随页面底色，不再靠假状态栏模拟 -->
<meta name="theme-color" content="#EFE6CE">
<style>
  :root{
    --nav-h: 56px;
    /* 不再是假状态栏，只作为「屏幕顶端留白」的度量 */
    --status-h: 28px;
    /* 真机安全区：全屏 / PWA 下由系统状态栏、刘海、home 条高度决定，浏览器里为 0 */
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    /* 各屏内容距屏幕顶端的距离（桌面预览沿用原状态栏高度，观感不变） */
    --screen-pad: var(--status-h);
    /* 菜单顶栏自身的内边距 */
    --bar-pad: calc(8px + var(--status-h));
    /* 阅读正文的字体：系统默认（安卓上就是系统 UI 字体 + 系统 CJK）。
       之前写的 "Noto Sans SC" 会让部分 ROM 匹配到 Noto，而不是手机自己的默认字体，
       正文跟系统其它应用对不上。测量层 .page-meas 必须用同一个栈，否则分页宽度会算错。 */
    --rp-font: system-ui, sans-serif;
    /* 正文左右内边距：现在由 JS 的 PAD_X 固定为 20px（见 pagePadFor），运行时写到 :root 上。
       这里只是首帧兜底值，别把布局写成依赖它的绝对值。 */
    --rp-pad-x: 20px;
    /* 正文字距：由 JS 的 fitLetterSpacing() 按屏宽实测选值（宽屏保持舒展的 .03em，
       窄屏才收到负值以保住一行 17 字），运行时写到 :root 上。这里是首帧兜底。 */
    --rp-ls: .03em;
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  /* 全局禁止选中文字。
     安卓 WebView 里长按一按到文字就会弹系统 ActionMode（复制/分享/全选），
     跟书架卡片「长按 500ms 删除」抢手势 —— 结果是想删书，先弹出一排复制按钮。
     阅读正文 .reader-stage 本来就是 -webkit-user-select:none，所以这里一起禁掉不改变阅读体验。 */
  html,body{
    height:100%;
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;
  }
  /* 输入框要留回来：禁选会让光标定位、长按改错字一起失灵 */
  input, textarea{ -webkit-user-select:text; user-select:text; }
  body{
    font-family:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:#2b2b30;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:24px;
    color:#222;
  }

  /* ===== 手机外框 ===== */
  .phone{
    width:390px; height:844px;
    background:#000; border-radius:44px;
    padding:10px;
    box-shadow:0 30px 80px rgba(0,0,0,.55);
    position:relative;
  }
  .screen-wrap{
    width:100%; height:100%;
    border-radius:36px; overflow:hidden;
    position:relative; background:#EFE6CE;
  }

  /* ===== 屏幕进入动画 ===== */
  .screen{
    position:absolute; inset:0;
    display:none; flex-direction:column;
    background:#EFE6CE;
  }
  .screen.active{ display:flex; }
  .screen.active:not(.tab-page){ animation:screenIn .34s cubic-bezier(.22,.61,.36,1) both; }
  @keyframes screenIn{ from{ opacity:0; transform:translateY(12px) scale(.985); } to{ opacity:1; transform:none; } }

  /* ===== 三个 tab 页（书架 / 导入 / 我的）横向平移切换 =====
     三页同时常驻、叠在同一起点，靠 translateX 错开：当前页 0，左邻 -100%，右邻 +100%。
     好处是各页滚动位置、输入框内容都天然保留，切换只动合成层，不触发重排。 */
  .screen.tab-page{
    display:flex;
    transform:translate3d(0,0,0);
    transition:transform .34s cubic-bezier(.22,.61,.36,1);
  }
  /* 底栏做等量反向位移（nav 宽度＝屏宽，百分比刚好抵消父级），
     视觉上钉在屏幕底部不动，只有内容在滑——和原生 App 的 tab 切换一个观感 */
  .tab-page .bottom-nav{
    transform:translate3d(0,0,0);
    transition:transform .34s cubic-bezier(.22,.61,.36,1);
  }
  /* 首帧就位（不等 JS）：.tab-page 是 display:flex，三页从解析起就都在屏幕上叠着，
     若不在这儿写死初始位移，开机看到的是 DOM 最靠后的「我的」页，然后才滑成书架。
     同理三份底栏也先反向抵消好，否则开机那一下底栏会从屏外滑进来。 */
  #bookshelf{ transform:translate3d(0,0,0); }
  #import{ transform:translate3d(100%,0,0); }
  #mine{ transform:translate3d(200%,0,0); }
  #bookshelf .bottom-nav{ transform:translate3d(0,0,0); }
  #import .bottom-nav{ transform:translate3d(-100%,0,0); }
  #mine .bottom-nav{ transform:translate3d(-200%,0,0); }
  /* 阅读页盖在三个 tab 页之上（tab 页常驻，不能靠 DOM 顺序压） */
  #reading{ z-index:20; }

  /* ===== 顶部留白（真实状态栏由系统绘制，页面不再自绘假状态栏） ===== */
  /* 书架 / 导入 / 我的 三屏顶部让出状态栏高度；阅读页保持沉浸式，不加留白 */
  #bookshelf, #import, #mine{ padding-top: var(--screen-pad); }

  /* ===== 书架页 ===== */
  .header{
    display:flex; align-items:center; justify-content:space-between;
    padding:6px 20px 12px;
  }
  .header h1{ font-size:22px; color:#4A3B28; font-weight:700; }
  /* ===== 书架搜索：收起时正好是右上角那枚圆形按钮，点开向左延伸成输入框 ===== */
  #bookshelf .header{ position:relative; }
  .search-bar{
    position:absolute; right:20px; top:50%; transform:translateY(-50%);
    width:34px; height:34px; border-radius:17px;
    background:#F0E6CE; color:#7A6A55;
    display:flex; align-items:center; overflow:hidden;
    z-index:3; cursor:pointer;
    transition:width .3s cubic-bezier(.22,.61,.36,1), box-shadow .25s, background .2s;
  }
  .search-bar.on{
    width:calc(100% - 40px); background:#F4EBD8;
    box-shadow:0 2px 10px rgba(90,70,45,.10); cursor:default;
  }
  .search-bar input{
    flex:1 1 auto; min-width:0; width:100%;
    border:0; outline:none; background:transparent;
    -webkit-appearance:none; appearance:none; border-radius:0;
    font-family:inherit; font-size:14px; color:#4A3B28;
    padding:0 0 0 14px; height:100%;
    opacity:0; transition:opacity .16s, padding-left .22s;
  }
  /* 收起态：输入框缩到 0 宽，左内边距也必须归零——否则它仍占 14px，
     把 34px 的按钮挤出胶囊右边 14px 被 overflow 裁掉，放大镜就不居中了 */
  .search-bar:not(.on) input{ padding-left:0; flex-basis:0; }
  .search-bar.on input{ opacity:1; transition-delay:.08s; }
  .search-bar input::placeholder{ color:#a89880; }
  .search-bar .sbtn{
    flex:0 0 auto; width:34px; height:34px;
    display:flex; align-items:center; justify-content:center;
    transition:transform .15s, color .2s;
  }
  .search-bar .sbtn:active{ transform:scale(.88); }
  /* 两个图标互斥：默认都藏起来，由 .on 只放出一个。
     注意不能先给 svg 写 display:block、再用 .ico-close 关掉——
     `.sbtn svg` 的选择器权重(0,2,1) 高于 `.search-bar .ico-close`(0,2,0)，
     会把隐藏规则盖掉，导致收起时 × 和放大镜并排出现。 */
  .search-bar .sbtn svg{ width:17px; height:17px; display:none; }
  .search-bar:not(.on) .ico-search{ display:block; }
  .search-bar.on .ico-close{ display:block; }
  /* 搜不到时的空态：跨满三列，居中 */
  .shelf-empty{
    grid-column:1 / -1; padding:64px 8px 40px; text-align:center;
    color:#a89880; font-size:13px; line-height:1.9;
  }
  .shelf-empty b{ display:block; color:#7A6A55; font-size:14px; margin-bottom:2px; font-weight:600; }

  .book-grid{
    flex:1; overflow-y:auto; padding:4px 20px 16px;
    display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px 16px;
    align-content:start;
  }
  .book{ cursor:pointer; transition:transform .16s ease; animation:cardIn .4s ease both; min-width:0; width:100%; }
  .book:active{ transform:scale(.94); }
  @keyframes cardIn{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:none; } }
  .book .cover{
    width:100%; height:140px; border-radius:8px;
    box-shadow:0 4px 10px rgba(0,0,0,.12);
    display:flex; align-items:flex-end; padding:8px;
    color:#fff; font-size:13px; font-weight:700; line-height:1.2;
    text-shadow:0 1px 3px rgba(0,0,0,.35);
    transition:box-shadow .2s, transform .16s;
    box-sizing:border-box;
    overflow:hidden; text-overflow:ellipsis;
  }
  .book:active .cover{ box-shadow:0 1px 4px rgba(0,0,0,.18); }
  .book .name{ margin-top:7px; font-size:12px; color:#4A3B28; font-weight:600;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .book .prog{ margin-top:2px; font-size:10px; color:#9a8b78; }

  /* ===== 长按删除确认弹层 ===== */
  .del-mask{ position:absolute; inset:0; background:rgba(20,18,15,.42); z-index:80;
    display:flex; align-items:center; justify-content:center; opacity:0; visibility:hidden;
    transition:opacity .18s ease, visibility 0s .18s; }
  .del-mask.show{ opacity:1; visibility:visible; transition:opacity .18s ease, visibility 0s 0s; }
  .del-card{ width:300px; background:#FBF3DF; border-radius:16px; padding:22px 20px 16px;
    box-shadow:0 16px 44px rgba(0,0,0,.3); text-align:center; transform:scale(.94);
    transition:transform .18s ease; }
  .del-mask.show .del-card{ transform:scale(1); }
  .del-card .del-title{ font-size:16px; font-weight:700; color:#4A3B28; }
  .del-card .del-book{ margin-top:8px; font-size:13px; color:#6E5A45; }
  .del-card .del-hint{ margin-top:6px; font-size:11px; color:#9a8b78; }
  .del-card .del-actions{ margin-top:18px; display:flex; gap:10px; }
  .del-card .del-actions button{ flex:1; height:40px; border:none; border-radius:10px;
    font-size:14px; font-weight:600; cursor:pointer; transition:filter .15s; }
  .del-card .del-actions button:active{ filter:brightness(.92); }
  .del-card .del-cancel{ background:#EAE0C8; color:#5a4a36; }
  .del-card .del-ok{ background:#B43C32; color:#fff; }

  /* ===== 底部导航 ===== */
  .bottom-nav{
    flex:0 0 auto; height:var(--nav-h);
    display:flex; align-items:center; justify-content:space-around;
    background:#F0E6CE; border-top:1px solid rgba(0,0,0,.05);
    padding-bottom:6px;
  }
  .bottom-nav .nav-item{
    display:flex; flex-direction:column; align-items:center; gap:3px;
    color:#7A6A55; cursor:pointer; font-size:11px;
    transition:color .2s, transform .15s;
  }
  .bottom-nav .nav-item:active{ transform:scale(.9); }
  .bottom-nav .nav-item.on{ color:#4A3B28; font-weight:700; }
  .bottom-nav .nav-item svg{ width:20px; height:20px; transition:transform .2s; }
  .bottom-nav .nav-item.on svg{ transform:translateY(-1px) scale(1.08); }
  .bottom-nav .nav-item.on::after{ content:""; width:18px; height:3px; border-radius:2px; background:#4A3B28; margin-top:-2px; animation:dotIn .25s ease; }
  @keyframes dotIn{ from{ transform:scaleX(0); opacity:0; } to{ transform:scaleX(1); opacity:1; } }

  /* ===== 阅读页 ===== */
  #reading{ background:#E8D5B0; transition:background .3s ease; }
  #reading .tap-hint{
    position:absolute; top:92px; left:0; right:0; text-align:center;
    font-size:11px; color:rgba(122,106,85,.55); pointer-events:none;
  }

  /* 分页舞台 + 页面 */
  .reader-stage{ position:relative; flex:1; overflow:hidden; cursor:pointer; touch-action:none; -webkit-user-select:none; user-select:none; }
  .reader-stage.shake{ animation:shake .3s ease; }
  @keyframes shake{ 0%,100%{ transform:translateX(0);} 20%{ transform:translateX(-7px);} 60%{ transform:translateX(7px);} 80%{ transform:translateX(-3px);} }
  /* 整书首/末页边界提示 */
  .boundary-toast{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    background:rgba(20,18,15,.72); color:#fff; font-size:14px; letter-spacing:1px;
    padding:10px 20px; border-radius:22px; z-index:60; pointer-events:none;
    opacity:0; transition:opacity .22s ease;
  }
  .boundary-toast.show{ opacity:1; }
  .reader-page{
    position:absolute; inset:0; z-index:1;
    font-family:var(--rp-font);
    font-size:var(--rp-fs, 18px); line-height:1.9; color:#4B2503;
    background-color:#E8D5B0; background-image:none;
    background-size:cover; background-position:center; background-repeat:no-repeat;
    transition:color .3s, background-color .3s;
    will-change:transform;
  }
  /* 翻页时「在上面的那一页」右缘窄阴影：向右压在下层页面上，
     既勾出上页的纸张边缘，也把上/下两层明确区分开。
     静止时页面与舞台等宽，阴影落在舞台外被 overflow:hidden 裁掉，不干扰阅读。 */
  .reader-page.edge-shadow{
    box-shadow: 5px 0 10px rgba(0,0,0,.20), 1px 0 2px rgba(0,0,0,.16);
  }
  /* 页内三段：章节标题 / 正文 / 状态栏，随页一起翻动 */
  .rp-shell{ display:flex; flex-direction:column; width:100%; height:100%; box-sizing:border-box; }
  /* 左上角小标题：所有页面同一位置；字体缩小、更靠上，但固定高度＝原高度，
     以保证正文不被上移、避开顶部挖孔摄像头 */
  /* 左上角小标题：所有页面同一位置。颜色/字号/字重都对齐页脚那一行（var(--rs)、12px、不加粗）——
     它只是「你在读什么」的弱提示，不该比正文更抢眼。高度 32px 只用来避开顶部挖孔摄像头，
     比原来的 42px 少了 10px，正文能再往上贴一点。 */
  .rp-chapter{ height:32px; display:flex; align-items:flex-start; padding:6px var(--rp-pad-x, 20px) 0; font-size:12px; font-weight:400; line-height:1.3; color:var(--rs, #AF8C71); flex:0 0 auto; box-sizing:border-box; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  /* 每章第一页：放大加粗靠左的章节标题（独立元素）；其上方小标题位置显示书名。
     标题完整显示、不限行数：分页时用「本章真实标题」实测它占几行，
     正文区自动让位（见 paginate 的 firstH），所以长标题也不会把页脚顶出屏幕。 */
  /* 章首页大标题：**字号和行高都是正文的 1.2 倍**（用户口径：正文 1 米高、标题 1.2 米高）。
     19px/28.5px → 22.8px/34.2px；与正文之间再空出一个标题行高（34.2px）。
     三者全从 --rp-fs / --rp-line 推出来，改字号时标题与留白同比缩放、不会错位。 */
  .rp-chapter-big{ font-size:calc(var(--rp-fs, 19px) * 1.2); font-weight:700;
    line-height:calc(var(--rp-line, 28.5px) * 1.2);
    padding:0 var(--rp-pad-x, 20px) calc(var(--rp-line, 28.5px) * 1.2);
    color:var(--rc, #4B2503); flex:0 0 auto; box-sizing:border-box; }
  /* 章首页因大标题占更多高度，补偿正文上内边距，避免分页错位 */
  .rp-shell.chapter-start .rp-body{ padding-top:0; }
  /* 正文：字距略微放开，密集排布时更好读；左右用 --rp-pad-x（按「一行至少 17 字」实测出来的），
     上内边距只留 4px —— 小标题已经压到 32px，正文再往上就是状态栏/挖孔。底部交给页脚统一控制 */
  .rp-body{ flex:1 1 auto; overflow:hidden; padding:4px var(--rp-pad-x, 20px) 0; box-sizing:border-box; text-align:justify; line-height:1.5; letter-spacing:var(--rp-ls, .03em); }
  /* 插图：宽高在分页时就算好了，直接写死 —— 图片解码是异步的，等它撑开会把分页算错。
     占位块（.rp-fig-ph）只在测量层用，尺寸与真图完全一致，所以「量的」就是「画的」。 */
  .rp-fig{ margin:0 0 1.1em; text-align:center; }
  .rp-fig img{ display:block; margin:0 auto; }
  .rp-fig-ph{ margin:0 auto; background:rgba(0,0,0,.055); border-radius:3px; }
  .rp-body p{ margin-bottom:16px; text-indent:2em; }
  .rp-body p.cont{ text-indent:0; }  /* 跨页接续段：首行不缩进 */
  .rp-body p:last-child{ margin-bottom:0; }  /* 末段不占额外下边距，避免底部凭空留白/分页少装一行 */
  /* 页脚只留「电量+时间 / 页码 / 全书进度」。
     高度仍是 1.5 倍行高（保持正文底边不动），但内容改为贴底对齐（align-items:flex-end + 3px 下内边距）：
     原来垂直居中时这条信息离屏幕底还有十几像素，现在几乎压在屏幕下沿。
     line-height 必须显式压成 1，否则继承 .reader-page 的 1.9，文字盒本身就有 23px 高，贴底也贴不下去。 */
  /* 页脚只占「文字 12px + 上方 6px + 距屏底 6px」= 24px。
     原来预留 1.5 倍正文行高（约 43px）却只把 12px 的字贴在最底下：
     正文底边以上那段 30px 的空盒，加上段首那一行排不下时的残留，
     眼睛看到的就是「底部空两三行」。预留高度越薄，正文能多排的字越多。 */
  /* 页脚左右固定 23px（不跟正文的 --rp-pad-x 走），电池与百分比左/右缘距屏幕边正好 23px */
  .rp-status{ position:relative; flex:0 0 auto; height:24px; display:flex; align-items:flex-end; justify-content:space-between; padding:0 23px 6px; font-size:12px; line-height:1; color:var(--rs, #AF8C71); box-sizing:border-box; }
  /* 页脚三栏：左＝本机电量+时间（阅读页自己的底栏，非系统状态栏）· 中＝页码绝对居中 · 右＝全书进度 */
  /* 左右两端各向中间收 3px（= 12px 字号的四分之一字），不跟着正文那条边距线走 */
  .rp-status .r-batt{ display:flex; align-items:center; gap:5px; }
  .rp-status .r-batt svg{ display:block; }
  /* 页码：去掉 1px 字距 + 去掉斜杠两侧空格，「3 / 12」→「3/12」，宽度缩到原来的六成 */
  .rp-status .mid{ position:absolute; left:50%; bottom:6px; transform:translateX(-50%); letter-spacing:0; font-variant-numeric:tabular-nums; }
  .rp-status .r-percent{ margin-left:auto; font-variant-numeric:tabular-nums; }
  #pageFront{ z-index:2; }

  /* ===== 整书进度滑动条（完全自绘） ===== */
  /* 现在嵌在「进度」二级菜单里，跟着面板一起出现，不再是贴底悬浮的独立条 */
  .pg-slider{
    position:relative; height:26px; display:flex; align-items:center;
    /* 左右留白要按「拖动放大后」的半径算，不是静置半径：
       静置 15px（半径 7.5），拖动时 scale(1.18) → 18px（半径 8.85），
       再加上 0 1px 4px 的投影，最远要 12.85px 才不被切。
       .sub-body 是 overflow-y:auto（另一轴会被一并算成 auto），
       越界就会被裁出一道直边，所以按 14px 留，静置/放大两种状态都留得住。 */
    padding:0 14px;
    color:var(--pgc, #4B2503); touch-action:none;
  }
  .pg-rail{
    position:relative; width:100%; height:4px; border-radius:4px;
    background:var(--pg-rail, rgba(90,70,45,.16));
  }
  .pg-fill{
    position:absolute; left:0; top:0; bottom:0; width:0;
    border-radius:inherit; background:currentColor; opacity:.62;
  }
  .pg-thumb{
    position:absolute; top:50%; left:0;
    width:15px; height:15px; border-radius:50%; box-sizing:border-box;
    background:var(--pg-bg, #E8D5B0); border:3px solid currentColor;
    box-shadow:0 1px 4px rgba(0,0,0,.26);
    transform:translate(-50%,-50%);
    transition:transform .14s ease;
  }
  .pg-slider.dragging .pg-thumb{ transform:translate(-50%,-50%) scale(1.18); }
  /* 轨道下方一行：左＝章节名（拖动时跟着目标变）· 右＝整书百分比 */
  .pg-meta{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:3px; font-size:12px; opacity:.78; }
  .pg-meta .ch{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pg-meta .pct{ flex:0 0 auto; font-variant-numeric:tabular-nums; }

  /* 亮度 / 字号滑条：同样自绘，替换浏览器默认外观，与进度条同一套视觉语言 */
  #bright, #fontRange{
    -webkit-appearance:none; appearance:none;
    background:transparent; height:22px; margin:0; outline:none;
  }
  #bright::-webkit-slider-runnable-track, #fontRange::-webkit-slider-runnable-track{
    height:4px; border-radius:4px; background:var(--pg-rail, rgba(90,70,45,.16));
  }
  #bright::-webkit-slider-thumb, #fontRange::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none;
    width:15px; height:15px; margin-top:-5.5px; box-sizing:border-box;
    border-radius:50%; background:var(--pg-bg, #E8D5B0);
    border:3px solid var(--pgc, #4A3B28);
    box-shadow:0 1px 4px rgba(0,0,0,.26);
  }
  #bright::-moz-range-track, #fontRange::-moz-range-track{
    height:4px; border-radius:4px; background:var(--pg-rail, rgba(90,70,45,.16));
  }
  #bright::-moz-range-thumb, #fontRange::-moz-range-thumb{
    width:11px; height:11px; box-sizing:border-box;
    border-radius:50%; background:var(--pg-bg, #E8D5B0);
    border:3px solid var(--pgc, #4A3B28);
  }

  /* 隐藏的排版测量层。字体必须与 .reader-page 完全一致（同一个 --rp-font），
     否则按真实字体量出来的行宽 / 行数与显示层不一致，会出现缩小遮字或放大不满页 */
  .page-meas{ position:absolute; top:-9999px; left:0; visibility:hidden; z-index:-1; font-family:var(--rp-font); }

  /* 亮度遮罩 */
  #dimmer{ position:absolute; inset:0; background:#000; opacity:0; pointer-events:none; transition:opacity .2s; z-index:30; }

  /* ===== 阅读菜单（背景随主题纯色，与阅读页基本一致） ===== */
  /* 用 visibility 而非 display:none，否则 transform 过渡不触发（动画会瞬切） */
  /* overflow:hidden 用来裁掉二级面板收起时露到屏幕下方的那段（它已经在视口外，只是不让它撑出滚动条） */
  #menu{ position:absolute; inset:0; z-index:40; overflow:hidden; visibility:hidden; pointer-events:none; transition:visibility 0s .3s; }
  #menu.show{ visibility:visible; pointer-events:auto; transition:visibility 0s 0s; }
  #menu .scrim{ position:absolute; inset:0; background:rgba(0,0,0,.28); opacity:0; transition:opacity .28s ease; }
  #menu.show .scrim{ opacity:1; }
  #menu .top-bar{
    position:absolute; top:0; left:0; right:0;
    background:#E8D5B0; color:#4A3B28;
    transform:translateY(-100%); transition:transform .3s cubic-bezier(.22,.61,.36,1);
    padding-top:var(--bar-pad);   /* 真机让出系统状态栏，别把顶栏顶到状态栏图标下面 */
  }
  #menu.show .top-bar{ transform:translateY(0); }
  #menu .top-bar .bar-row{ display:flex; align-items:center; justify-content:space-between; padding:6px 22px 10px; }
  #menu .top-bar .back{ font-size:22px; cursor:pointer; line-height:1; transition:transform .15s; }
  #menu .top-bar .back:active{ transform:scale(.85); }
  #menu .top-bar .book-name{ font-size:15px; font-weight:700; }
  #menu .bottom-panel{
    position:absolute; left:0; right:0; bottom:0;
    background:#E8D5B0; color:#7A6A55;
    transform:translateY(100%); transition:transform .3s cubic-bezier(.22,.61,.36,1);
    padding:14px 22px 14px;
    /* 关键：不能再 overflow:hidden。
       二级面板是绝对定位、靠自身上滑来覆盖图标行，它的高度往往大于这一行图标；
       父级一旦裁剪，就只好反过来把父级撑高 —— 那正是「菜单瞬间抬高」的来源。
       改成 visible 后，一级图标行原地不动，二级面板从底部平滑升起并盖住它，
       多出来的部分自然向上延伸出面板（背景同色，看起来就是一整块升起）。 */
    overflow:visible;
  }
  #menu.show .bottom-panel{ transform:translateY(0); }
  .menu-icons{ display:flex; justify-content:space-around; padding-bottom:6px; }
  .menu-icons .mi{ display:flex; flex-direction:column; align-items:center; gap:5px; font-size:11px; cursor:pointer; transition:transform .15s, color .2s; }
  .menu-icons .mi:active{ transform:scale(.88); }
  .menu-icons .mi svg{ width:22px; height:22px; }
  .divider{ height:1px; background:currentColor; opacity:.14; margin:14px 0; }
  .swatches{ display:flex; gap:14px; }
  .swatch{ width:40px; height:40px; border-radius:50%; cursor:pointer; border:2px solid transparent; box-shadow:0 1px 4px rgba(0,0,0,.18); transition:transform .15s, border-color .2s; }
  .swatch:active{ transform:scale(.9); }
  .swatch.on{ transform:scale(1.05); }
  /* 字号二级菜单：A− · 滑块 · A+，下方一行提示当前档位与字号值 */
  .font-row{ display:flex; align-items:center; gap:14px; }
  .font-row .fa{
    width:36px; height:36px; flex:0 0 auto; padding:0;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%; border:1.5px solid currentColor; background:transparent;
    color:inherit; font-family:inherit; font-size:14px; line-height:1;
    cursor:pointer; opacity:.72; transition:transform .12s, opacity .15s;
  }
  .font-row .fa:active{ transform:scale(.88); opacity:1; }
  .font-row .fa.big{ font-size:17px; }
  #fontRange{ flex:1; min-width:0; }
  .font-meta{ display:flex; align-items:center; justify-content:space-between; margin-top:5px; font-size:12px; opacity:.72; }
  .font-meta .val{ font-variant-numeric:tabular-nums; }
  .bright-row{ display:flex; align-items:center; gap:12px; }
  .bright-row input{ flex:1; accent-color:#4A3B28; }
  /* 二级菜单：从底部滑入，覆盖图标行 */
  .sub-panel{
    position:absolute; left:0; right:0; bottom:0;
    background:#E8D5B0; color:#7A6A55;
    padding:14px 22px 14px;
    transform:translateY(100%); transition:transform .28s cubic-bezier(.22,.61,.36,1);
    display:flex; flex-direction:column;
    /* 内容再多也不许顶到顶栏，超出的部分由 .sub-body 自己滚动 */
    max-height:62vh;
  }
  .sub-panel.show{ transform:translateY(0); }
  .sub-head{ display:flex; align-items:center; justify-content:space-between; padding-bottom:12px; flex:0 0 auto; }
  .sub-head .back{ font-size:22px; cursor:pointer; line-height:1; transition:transform .15s; }
  .sub-head .back:active{ transform:scale(.85); }
  .sub-head .sub-title{ font-size:15px; font-weight:700; }
  /* 圆盘选中时 scale(1.05) 且带 4px 投影，会比 40px 的盒子向外溢出几像素。
     overflow 的裁剪边界是各自元素的 padding box —— 所以留白必须加在 .sub-body 上，
     加在 .swatches 里没用（那只是把它的盒子撑大，撑出去的那圈照样被 body 裁掉）。
     padding + 等量负 margin：内容视觉位置不动，只把裁剪边界向外推 6px。 */
  .sub-body{ overflow-y:auto; min-height:0; padding:6px 2px 0; margin:-6px -2px 0; }
  .sub-sec{ display:none; }
  .sub-sec.active{ display:block; }
  .set-row{ display:flex; align-items:center; gap:16px; margin-bottom:16px; }
  .set-row .set-label{ font-size:13px; flex:0 0 auto; opacity:.8; }
  .set-info{ font-size:13px; line-height:1.7; opacity:.85; }

  /* 目录侧栏。
     **收起态必须不留投影**：它整块 translateX(-100%) 缩到屏幕左外侧，右缘正好压在 x=0，
     如果一直挂着 `4px 0 20px`，那道 blur 会直接从屏幕左边缘渗回视线里 ——
     阅读页左侧那条「莫名的阴影」就是它（把手早就用 opacity:0 挡掉了，面板本身没挡）。
     所以收起态写全透明阴影，只在 .show 时才画实色，这样又保留展开时的柔和过渡。 */
  #toc{ position:absolute; top:0; bottom:0; left:0; width:74%; max-width:300px;
    background:#F0E6CE; z-index:50; transform:translateX(-100%);
    transition:transform .28s cubic-bezier(.22,.61,.36,1), box-shadow .24s ease;
    display:flex; flex-direction:column; box-shadow:4px 0 20px rgba(0,0,0,0); overflow:hidden; }
  #toc.show{ transform:translateX(0); box-shadow:4px 0 20px rgba(0,0,0,.2); }
  #toc .toc-head{ padding:calc(24px + var(--safe-top)) 20px 12px; font-size:17px; font-weight:700; color:#4A3B28; }
  /* 列表 + 浮在右边缘的把手：把手要能滑出面板外再被裁掉，所以裁剪交给 #toc 的 overflow:hidden */
  #toc .toc-body{ position:relative; flex:1; min-height:0; display:flex; }
  #toc .toc-list{ flex:1; min-width:0; overflow-y:auto; padding:0 20px 20px; }
  /* 目录专用滚动把手：比通用滚动条粗，默认大半缩进右边只露一道边，点一下 / 拖动时探出来。
     颜色是实色（各主题的 --grip-bg，由 JS 按主题给），收起 / 探出永远同一个颜色；
     扁平色块 + 一层柔和外投影浮起，不加内高光 / 内影那类纹理光 */
  #toc .toc-grip{
    position:absolute; right:0; top:0; width:22px; height:56px; z-index:2;
    display:flex; align-items:center; justify-content:center;
    border-radius:11px; color:#4A3B28; background:var(--grip-bg, #EDE0C3);
    box-shadow:0 1px 5px rgba(74,59,40,.22), 0 0 0 1px rgba(74,59,40,.10);
    transform:translateX(12px);            /* 收进面板外，只剩 10px 露头 */
    transition:transform .28s cubic-bezier(.22,.61,.36,1), opacity .16s ease, background .2s ease, box-shadow .2s ease;
    touch-action:none; cursor:grab; -webkit-tap-highlight-color:transparent;
    /* 目录没打开时不画、也不吃点击 —— 否则面板缩到屏幕外后，这截「露头」会粘在屏幕左边缘 */
    opacity:0; pointer-events:none;
  }
  #toc.show .toc-grip{ opacity:1; pointer-events:auto; transition-delay:0s, .16s, 0s, 0s; }
  /* 手指按到比看到的更宽一圈（横向扩到 20px，正好落在列表右内边距里，不吃正文的点击） */
  #toc .toc-grip::before{ content:""; position:absolute; inset:-8px -2px -8px -12px; }
  /* 缩在边里时不画三条横线，只留一道干净的浅色边，避免露半截像瑕疵 */
  #toc .toc-grip svg{ opacity:0; transition:opacity .2s ease; }
  #toc.grip-out .toc-grip{ transform:translateX(-3px); box-shadow:0 2px 9px rgba(74,59,40,.26), 0 0 0 1px rgba(74,59,40,.13); }
  #toc.grip-out .toc-grip svg{ opacity:1; }
  #toc.dark .toc-grip{ color:#D9D9D9; box-shadow:0 1px 5px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.07); }
  #toc.dark.grip-out .toc-grip{ box-shadow:0 2px 9px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.10); }
  @media (prefers-reduced-motion: reduce){ #toc .toc-grip{ transition:none; } }
  /* --toc-ind 由 JS 按目录层级写入，二级条目缩进一档；:active 要叠在它上面，不能直接写 padding-left */
  #toc .toc-item{ padding:13px 0; padding-left:var(--toc-ind, 0px); font-size:14px; color:#5a4a36; border-bottom:1px solid rgba(0,0,0,.06); cursor:pointer; transition:color .2s, padding-left .2s; }
  #toc .toc-item:active{ padding-left:calc(var(--toc-ind, 0px) + 6px); }
  #toc .toc-item.on{ color:#4A3B28; font-weight:700; }
  #toc .toc-close{ position:absolute; top:calc(22px + var(--safe-top)); right:18px; font-size:20px; cursor:pointer; color:#7A6A55; transition:transform .15s; }
  #toc .toc-close:active{ transform:scale(.85) rotate(90deg); }

  /* ===== 导入 / 我的 ===== */
  .center-screen{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; color:#7A6A55; padding:0 30px; text-align:center; }
  .import-btn{ background:#4A3B28; color:#F0E6CE; border:none; padding:14px 30px; border-radius:26px; font-size:15px; cursor:pointer; font-family:inherit; transition:transform .15s, box-shadow .2s; box-shadow:0 4px 12px rgba(74,59,40,.3); }
  .import-btn:active{ transform:scale(.95); box-shadow:0 2px 6px rgba(74,59,40,.3); }
  .import-btn input{ display:none; }
  .mine-card{ width:100%; background:#F0E6CE; border-radius:16px; padding:22px; display:flex; align-items:center; gap:16px; transition:transform .15s; }
  .mine-card:active{ transform:scale(.98); }
  .mine-avatar{ width:56px; height:56px; border-radius:50%; background:#4A3B28; color:#F0E6CE; display:flex; align-items:center; justify-content:center; font-size:22px; }
  .mine-card .info .n{ font-size:17px; color:#4A3B28; font-weight:700; }
  .mine-card .info .s{ font-size:12px; color:#9a8b78; margin-top:3px; }
  .mine-row{ width:100%; background:#F0E6CE; border-radius:12px; padding:16px 18px; display:flex; justify-content:space-between; color:#5a4a36; font-size:14px; transition:transform .15s, background .2s; }
  .mine-row:active{ transform:scale(.99); background:#e9dec4; }

  /* ===== 自绘滚动条：替换浏览器原生滚动条，上下滑动时浮现，停手后淡出 ===== */
  *{ scrollbar-width:none; }
  *::-webkit-scrollbar{ width:0; height:0; }
  .csb{
    position:absolute; z-index:72;
    opacity:0; pointer-events:none;
    transition:opacity .22s ease;
  }
  .csb.show{ opacity:1; }
  .csb .csb-thumb{
    position:absolute; right:4px; width:5px; border-radius:99px;
    background:rgba(74,59,40,.38);
    transition:width .16s ease, background .16s ease;
  }
  .csb.show .csb-thumb{ pointer-events:auto; touch-action:none; }
  .csb.drag .csb-thumb{ width:6px; background:rgba(74,59,40,.60); }
  /* 夜间主题下的目录 / 设置面板是深底，拇指换成浅色 */
  .csb.on-dark .csb-thumb{ background:rgba(255,255,255,.34); }
  .csb.on-dark.drag .csb-thumb{ background:rgba(255,255,255,.56); }

  /* ===== 真机适配：手机浏览器直接铺满视口，不再套一层手机外框 ===== */
  @media (max-width: 560px), (max-height: 560px){
    :root{
      /* 真机：系统状态栏由手机自己画，页面只让出安全区（浏览器里为 0，全屏/PWA 下为状态栏高度） */
      --screen-pad: calc(10px + var(--safe-top));
      --bar-pad: calc(10px + var(--safe-top));
    }
    html, body{ height:100%; }
    body{
      display:block; padding:0;
      min-height:100vh; min-height:100dvh;
      background:#EFE6CE;
    }
    .phone{
      width:100%; height:100vh; height:100dvh;
      padding:0; border-radius:0; box-shadow:none; background:#000;
    }
    .screen-wrap{ border-radius:0; height:100%; }
    /* 底部导航条给 home 指示条让位 */
    .bottom-nav{ height:calc(var(--nav-h) + var(--safe-bottom)); padding-bottom:calc(6px + var(--safe-bottom)); }
  }
</style>
</head>
<body>
<div class="phone">
  <div class="screen-wrap">

    <!-- ===================== 书架页 ===================== -->
    <section class="screen tab-page active" id="bookshelf">
      <div class="header">
        <h1>书架</h1>
        <!-- 搜索：收起态＝右上角圆按钮，点开后从按钮位置向左延伸成输入框（覆盖标题） -->
        <div class="search-bar" id="searchBar">
          <input id="searchInput" type="text" placeholder="搜索书名" autocomplete="off" enterkeyhint="search" aria-label="搜索书名">
          <div class="sbtn" id="searchToggle" role="button" aria-label="搜索">
            <svg class="ico-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
            <svg class="ico-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </div>
        </div>
      </div>
      <div class="book-grid" id="bookGrid"></div>
      <nav class="bottom-nav" id="navBookshelf">
        <div class="nav-item on" data-screen="bookshelf">
          <svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="1"/></svg>
          <span>书架</span>
        </div>
        <div class="nav-item" data-screen="import">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v11"/><path d="M8 10l4 4 4-4"/><path d="M5 19h14"/></svg>
          <span>导入</span>
        </div>
        <div class="nav-item" data-screen="mine">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
          <span>我的</span>
        </div>
      </nav>

      <!-- 长按删除确认弹层 -->
      <div class="del-mask" id="delMask">
        <div class="del-card">
          <div class="del-title">删除这本书？</div>
          <div class="del-book" id="delBookName"></div>
          <div class="del-hint">删除后无法恢复</div>
          <div class="del-actions">
            <button class="del-cancel" id="delCancel">取消</button>
            <button class="del-ok" id="delOk">删除</button>
          </div>
        </div>
      </div>
    </section>

    <!-- ===================== 阅读页 ===================== -->
    <section class="screen" id="reading">
      <div class="tap-hint">中点开菜单 ｜ 左半屏上一页 ｜ 右半屏下一页</div>

      <div class="reader-stage" id="readerStage">
        <div class="reader-page" id="pageFront"></div>
        <div class="reader-page" id="pageBack"></div>
          <div class="page-meas" id="meas">
            <div class="rp-shell"><div class="rp-chapter"></div><div class="rp-chapter-big"></div><div class="rp-body" id="measBody"></div><div class="rp-status"></div></div>
        </div>
      </div>
      <div id="dimmer"></div>
      <div class="boundary-toast" id="boundaryToast"></div>

      <!-- 菜单 -->
      <div id="menu">
        <div class="scrim" id="menuScrim"></div>
        <div class="top-bar">
          <div class="bar-row">
            <span class="back" id="menuBack">←</span>
            <span class="book-name" id="menuBook">暗流</span>
            <span style="width:22px"></span>
          </div>
        </div>
        <div class="bottom-panel" id="bottomPanel">
          <!-- 一级菜单：单行图标 -->
          <div class="menu-icons" id="menuIcons">
            <div class="mi" data-act="toc">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16M4 12h16M4 19h10"/></svg>
              <span>目录</span>
            </div>
            <div class="mi" data-act="font">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4.5 19.5 12 4.5l7.5 15M8 14.5h8"/></svg>
              <span>字号</span>
            </div>
            <div class="mi" data-act="pg">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18"/><circle cx="9.5" cy="12" r="3.4" fill="currentColor" stroke="none"/></svg>
              <span>进度</span>
            </div>
            <div class="mi" data-act="bright">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>
              <span>亮度</span>

<script>
(async function(){
  // ---------- 数据 ----------
  // 内置示例书：共享一段样例章节（原型演示用；导入的书各自持有真实解析出的章节）
  const SAMPLE_CHAPTERS = [
    { title:"第一章 · 夜行", body:[
      "夜色像浸了水的墨，沉沉地压在青石板上。巷子尽头那盏昏黄的灯，被风推得摇摇晃晃，把人的影子拉得老长。",
      "他裹紧了外袍，脚步放得极轻。身后的脚步声却始终没有停——不紧不慢，像是早算准了他要往哪儿去。",
      "转过墙角，他忽然停住。面前是一口枯井，井沿长满了青苔，井底黑得望不到底。那脚步声，也在这时贴到了他背后三寸之处。",
      "“你跟了一路，”他没回头，声音平得像水面，“总该说句话吧。”",
      "身后的人笑了，笑声里带着几分他熟悉又陌生的意味：“多年不见，你还是这般警觉，一点没变。”",
      "他没有接话，只是把右手缓缓探进了袖中。那里藏着一柄三寸长的短刃，刃口在黑暗里凉得像是另一截夜色。",
      "“我不是来伤你的。”那人又近了一步，脚步声终于停了，“我只是想问问，那封信，你读到第几句才明白过来？”",
      "他瞳孔微微一缩。那封信他烧了整整三年，灰烬早被雨水冲进了护城河，可此刻听来，仿佛字句又重新浮上了舌尖。",
      "风忽然大了，灯熄了一瞬又亮。就在这明灭之间，他看清了那人腰间悬着的一枚铜鱼——和他袖中那半枚，恰好是一对。",
      "“原来是故人。”他终于转过身，短刃在灯下映出一线冷光，“可故人，也不一定站在哪一边。”"
    ]},
    { title:"第二章 · 故人", body:[
      "那人把铜鱼解下来，放在掌心，轻轻一合，竟与他的半枚严丝合缝，拼出一条完整的逆流之鱼。",
      "“十年了，”故人低声道，“自城墙那场火之后，我以为你早就死在那东门里。”",
      "他想起那个夜晚：火光染红了半座城，他与一个戴面具的人背靠背，守住了最后一道门。后来面具人坠入火海，他拼死逃出。",
      "“我没死，”他说，“只是再没敢用原来的名字活。”",
      "故人叹了口气，把合好的铜鱼推回他手中：“这东西本是一对，当年被火劈成两半。我留了半枚，另一半，我一直以为随你埋进了灰里。”",
      "他握紧铜鱼，指节发白。十年逃亡，他竟一直把最重要的信物带在身上，却从不知它的来历。",
      "“那你今晚来，究竟要什么？”他问。",
      "“要一个答案。”故人的眼神忽然变得锐利，“那封信上说，城破不是因为外敌，而是因为城内有人开了门。我想知道，那个人是谁。”",
      "他沉默了很久。远处传来打更的梆子，一下，两下，像是替他数着压在心底十年的重量。",
      "“如果你真想知道，”他终于开口，“明夜子时，来这口井边。我会把知道的，全告诉你。”"
    ]},
    { title:"第三章 · 暗流", body:[
      "故人走后，他独自在井边站了许久。铜鱼贴在胸口，竟有一丝温意，像是十年未凉的血。",
      "他想起师父临终前的话：江湖从不在明处，真正的波澜，都藏在你看不见的水底。",
      "第二夜，他比约定早到了一个时辰。井边空无一人，只有风穿过巷子，发出细碎的呜咽。",
      "他蹲下身，借着月光看那井水。水面平静，却隐隐有什么东西，顺着看不见的暗流，缓缓浮了上来。",
      "那是一截蜡封的竹筒，筒身刻着与他铜鱼上一模一样的纹路。他伸手捞起，指尖触到的一瞬，心跳漏了一拍。",
      "竹筒里没有信，只有一张极薄的绢，上面只写了八个字：门未开，人已非。",
      "他愣住了。故人问的是“谁开了门”，可这绢上说的却是——门从未真正打开过。",
      "那么当年那场城破，究竟是怎么发生的？那个他追了十年的“叛徒”，难道只是镜花水月？",
      "远处传来极轻的脚步声。他猛地握紧竹筒转身，却见巷口站着的，不是故人，而是一个他绝未料到会来的人。",
      "“你果然在这里。”那人微微一笑，“看来，你也收到请帖了。”"
    ]},
  ];

  // 当前阅读书的章节（打开不同书时切换指向）
  let chapters = SAMPLE_CHAPTERS;
  let currentBook = null;   // 当前打开的书对象（含 id / chapters / progress）

  // 内置书：原型演示，共享样例章节；seed 为初始进度（让书架看起来有阅读痕迹，读过后被真实进度覆盖）
  const builtinBooks = [
    { id:"b-anliu",     name:"暗流",       color:"#3a5a78", seed:{ch:1,page:0,percent:45} },
    { id:"b-changan",   name:"长安十二时辰", color:"#8a5a3a", seed:{ch:2,page:0,percent:62} },
    { id:"b-jianlai",   name:"剑来",       color:"#4a6b50", seed:{ch:2,page:9,percent:100} },
    { id:"b-qingyu",    name:"庆余年",     color:"#7a4a6b", seed:{ch:0,page:1,percent:12} },
    { id:"b-fanren",    name:"凡人修仙传",  color:"#5a5a5a", seed:{ch:1,page:2,percent:70} },
    { id:"b-guimi",     name:"诡秘之主",    color:"#3a3a5a", seed:{ch:1,page:3,percent:67} },
    { id:"b-xuezhong",  name:"雪中悍刀行",  color:"#6b4a3a", seed:{ch:0,page:0,percent:3} },
    { id:"b-doupou",    name:"斗破苍穹",    color:"#8a3a3a", seed:{ch:1,page:0,percent:40} },
    { id:"b-zhetian",   name:"遮天",       color:"#3a6b6b", seed:{ch:2,page:9,percent:100} },
  ];
  builtinBooks.forEach(b=>{ b.builtin = true; b.chapters = SAMPLE_CHAPTERS; b.progress = null; });
  const importedBooks = [];   // 导入的书，加载后填充

  // ---------- 本地存储（进度 / 导入书 / 个人设置 / 目录 / 最近阅读） ----------
  const LS_PROG = "reader.progress.v1";
  const LS_IMP  = "reader.imported.v1";
  const LS_SET  = "reader.settings.v1";
  // 设置结构版本：v2 起字号默认 19；v3 起「亮度」的含义从「遮罩深浅」翻成「亮度」（60=最亮）。
  // 读老数据时按版本做一次性换算，用户存过的值不会被重置。
  const SET_V   = 3;
  // 目录缓存的键带解析引擎版本号：切章规则升级（如支持行首缩进的「第X节」）后，
  // 旧版缓存的分章结果会失效自动重切，避免用户继续看到「几章混成一章」的旧目录。
  const LS_TOC  = "reader.toc.v2";      // 每本导入书的固定目录 [{title,start,end}]，首开后不再重复全文切分
  const LS_LAST = "reader.lastRead.v1"; // { [bookId]: 最近阅读时间戳 }，用于书架按最近阅读倒序
  const LS_DEL  = "reader.deletedBuiltin.v1"; // 已删除的内置书 id 集合（黑名单，刷新后不再出现）
  let progressStore = {};     // { [bookId]: {ch, page, percent} }
  let tocStore = {};          // { [bookId]: [{title,start,end}] }
  let lastReadStore = {};     // { [bookId]: timestamp }
  const deletedBuiltin = new Set();   // 已删除的内置书 id

  async function loadStore(){
    try{ progressStore = JSON.parse(localStorage.getItem(LS_PROG) || "{}"); }catch(e){ progressStore = {}; }
    try{ tocStore = JSON.parse(localStorage.getItem(LS_TOC) || "{}"); }catch(e){ tocStore = {}; }
    try{ lastReadStore = JSON.parse(localStorage.getItem(LS_LAST) || "{}"); }catch(e){ lastReadStore = {}; }
    try{
      const del = JSON.parse(localStorage.getItem(LS_DEL) || "[]");
      del.forEach(id=>deletedBuiltin.add(id));
      // 读回黑名单后，从内置书列表过滤掉已删除的书（刷新后不再出现）
      for(let i = builtinBooks.length - 1; i >= 0; i--){
        if(deletedBuiltin.has(builtinBooks[i].id)) builtinBooks.splice(i, 1);
      }
    }catch(e){}
    try{
      const arr = JSON.parse(localStorage.getItem(LS_IMP) || "[]");
      const db = await idbOpen();
      for(const x of arr){
        try{
          // 正文从 IndexedDB 取回（大文件也不受 localStorage 配额限制）
          const text = db ? await idbGet(db, "text:"+x.id) : x.text;
          const finalText = (text || x.text || "");
          const imgs = db ? await idbGet(db, "img:"+x.id) : null;
          importedBooks.push({ id:x.id, name:x.name, color:x.color, text: finalText, imported:true,
                               images: (imgs && imgs.length) ? imgs : null,
                               chapters: null, toc: tocStore[x.id] || null,
                               progress: progressStore[x.id] || null });
          if(finalText) textWritten.add(x.id);   // 已从 IndexedDB 读回，后续无需重复写
        }catch(e){}
      }
    }catch(e){}
    try{
      const s = JSON.parse(localStorage.getItem(LS_SET) || "{}");
      if(s.theme) curTheme = s.theme;
      // 默认字号 2026-11-07 从 18 提到 19。老版本本地存着「旧默认 18」的人，升级后要看到 19；
      // 但自己调过字号的人（存的是 16/22…）不能被覆盖 —— 用设置版本号做一次性迁移，v>=2 之后完全听用户的。
      if(typeof s.font === "number") fontPx = ((s.v|0) >= 2 || s.font !== 18) ? s.font : 19;
      if(typeof s.bright === "number"){
        // v<3 存的是「遮罩深浅」（0=最亮），换算成「亮度」；v>=3 存的就是亮度本身
        brightVal = ((s.v|0) >= 3) ? s.bright : (BRIGHT_MAX - s.bright);
        brightVal = Math.min(BRIGHT_MAX, Math.max(0, brightVal));
      }
    }catch(e){}
  }
  // IndexedDB 兜底存储：正文 text 可能很大（几十 MB），localStorage 5MB 配额装不下会导致导入书丢失。
  // 因此正文单独存 IndexedDB（reader-texts 库），localStorage 只存轻量元数据。
  const IDB_NAME = "reader-storage", IDB_STORE = "texts";
  let idb = null;
  function idbOpen(){
    return new Promise((resolve)=>{
      if(!("indexedDB" in window)){ resolve(null); return; }
      if(idb){ resolve(idb); return; }
      try{
        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = ()=>{ req.result.createObjectStore(IDB_STORE); };
        req.onsuccess = ()=>{ idb = req.result; resolve(idb); };
        req.onerror = ()=>{ resolve(null); };
      }catch(e){ resolve(null); }
    });
  }
  function idbPut(db, key, val){
    return new Promise((resolve)=>{
      if(!db){ resolve(false); return; }
      try{
        const tx = db.transaction(IDB_STORE, "readwrite");
        tx.objectStore(IDB_STORE).put(val, key);
        tx.oncomplete = ()=>resolve(true);
        tx.onerror = ()=>resolve(false);
      }catch(e){ resolve(false); }
    });
  }
  function idbGet(db, key){
    return new Promise((resolve)=>{
      if(!db){ resolve(undefined); return; }
      try{
        const tx = db.transaction(IDB_STORE, "readonly");
        const rq = tx.objectStore(IDB_STORE).get(key);
        rq.onsuccess = ()=>resolve(rq.result);
        rq.onerror = ()=>resolve(undefined);
      }catch(e){ resolve(undefined); }
    });
  }
  function idbDel(db, key){
    return new Promise((resolve)=>{
      if(!db){ resolve(false); return; }
      try{
        const tx = db.transaction(IDB_STORE, "readwrite");
        tx.objectStore(IDB_STORE).delete(key);
        tx.oncomplete = ()=>resolve(true);
        tx.onerror = ()=>resolve(false);
      }catch(e){ resolve(false); }
    });
  }

  function persist(){
    try{
      localStorage.setItem(LS_PROG, JSON.stringify(progressStore));
      // 正文 text 较大，仅存元数据，正文走 IndexedDB（绝不塞进 localStorage，避免超配额）
      localStorage.setItem(LS_IMP, JSON.stringify(importedBooks.map(b=>({id:b.id, name:b.name, color:b.color, hasText:!!b.text}))));
      localStorage.setItem(LS_SET, JSON.stringify({v:SET_V, theme:curTheme, font:fontPx, bright:brightVal}));
      localStorage.setItem(LS_TOC, JSON.stringify(tocStore));
      localStorage.setItem(LS_LAST, JSON.stringify(lastReadStore));
      localStorage.setItem(LS_DEL, JSON.stringify([...deletedBuiltin]));
    }catch(e){ /* 隐私模式 / 配额超限时静默降级 */ }
  }

    return i > 0 ? String(path).slice(0, i) : "";
  }
  function epubXml(text){
    const d = new DOMParser().parseFromString(text, "application/xml");
    if(d.getElementsByTagName("parsererror").length) return new DOMParser().parseFromString(text, "text/html");
    return d;
  }
  // 按 localName 取元素，绕开 dc:/opf: 之类前缀
  function epubEls(root, name){
    const out = [];
    if(!root) return out;
    const all = root.getElementsByTagName("*");
    for(let i = 0; i < all.length; i++) if(all[i].localName === name) out.push(all[i]);
    return out;
  }
  const EPUB_BLOCKS = new Set("p div h1 h2 h3 h4 h5 h6 ul ol li dl dt dd blockquote pre table thead tbody tr td th section article header footer aside nav figure figcaption hr".split(" "));
  const EPUB_SKIP = new Set("script style noscript svg math img image video audio iframe object canvas".split(" "));
  function epubNodeText(n){
    if(n.nodeType === 3) return n.nodeValue;
    if(n.nodeType !== 1) return "";
    const tag = (n.tagName || "").toLowerCase();
    if(tag === "br") return "\n";
    if(EPUB_SKIP.has(tag)) return "";
    let s = "";
    for(let c = n.firstChild; c; c = c.nextSibling) s += epubNodeText(c);
    return s;
  }
  // 一个块元素 → 若干行（<br> 断行，空白规范化），空行丢掉
  function epubPushLines(s, out){
    for(const raw of String(s).split("\n")){
      const t = raw.replace(/[\s\u00a0\u3000]+/g, " ").trim();
      if(t) out.push(t);
    }
  }
  // 取插图地址：<img src>，或 EPUB3 常见的 <svg><image xlink:href>
  function epubImgSrc(el, tag){
    if(tag === "img") return el.getAttribute("src") || "";
    let im = null;
    try{ im = el.localName === "image" ? el : el.querySelector("image"); }catch(_){}
    if(!im) return "";
    return im.getAttribute("xlink:href") || im.getAttribute("href") ||
           im.getAttributeNS("http://www.w3.org/1999/xlink", "href") || "";
  }
  // 字节 → base64（分块拼，String.fromCharCode.apply 一个几 MB 的数组会爆栈）
  function epubB64(u8){
    const STEP = 0x8000;
    let s = "";
    for(let i = 0; i < u8.length; i += STEP){
      s += String.fromCharCode.apply(null, u8.subarray(i, i + STEP));
    }
    return btoa(s);
  }
  function epubImgMime(p){
    const m = /\.(png|jpe?g|gif|webp|bmp|svgz?|avif)$/i.exec(String(p || ""));
    const e = m ? m[1].toLowerCase() : "";
    if(e === "png") return "image/png";
    if(e === "gif") return "image/gif";
    if(e === "webp") return "image/webp";
    if(e === "bmp") return "image/bmp";
    if(e === "avif") return "image/avif";
    if(e === "svg" || e === "svgz") return "image/svg+xml";
    return "image/jpeg";
  }
  // 量图片原始像素尺寸（分页要按它算显示宽高）
  function epubImgSize(url){
    return new Promise(res=>{
      const im = new Image();
      let done = false;
      const fin = (w, h)=>{ if(done) return; done = true; res({ w: w || 0, h: h || 0 }); };
      im.onload = ()=>fin(im.naturalWidth, im.naturalHeight);
      im.onerror = ()=>fin(0, 0);
      setTimeout(()=>fin(0, 0), 4000);   // 解码卡住也别让导入永久挂起
      im.src = url;
    });
  }
  // 把 body 摊平成 [{ text, level }]：level 0=普通段，1~6=h1~h6
  // 顺带记一张「id/name → 行号」表：目录锚点靠它定位，才能在一个 xhtml 里切出多节
  function epubBlocks(root){
    const out = [];
    const anchors = new Map();
    (function walk(node){
      for(let c = node.firstChild; c; c = c.nextSibling){
        if(c.nodeType === 3){
          const t = String(c.nodeValue).replace(/[\s\u00a0\u3000]+/g, " ").trim();
          if(t) out.push({ text: t, level: 0 });
          continue;
        }
        if(c.nodeType !== 1) continue;
        const tag = (c.tagName || "").toLowerCase();
        // 图片要在 EPUBSKIP 之前拦下来：img 在跳过表里，等走到下面就没了
        if(tag === "img" || tag === "svg" || tag === "image"){
          const src = epubImgSrc(c, tag);
          if(src){ out.push({ text: "", level: 0, img: src }); continue; }
        }
        if(EPUB_SKIP.has(tag)) continue;
        // 此刻 out.length 就是该元素第一行在全书里的行号（前面已产出的行数）
        const aid = c.getAttribute("id") || c.getAttribute("name") || "";
        if(aid && !anchors.has(aid)) anchors.set(aid, out.length);
        const hm = /^h([1-6])$/.exec(tag);
        let hasBlock = false;
        for(let k = c.firstElementChild; k; k = k.nextElementSibling){
          const kt = (k.tagName || "").toLowerCase();
          // 图片也算「块」：<p><img/></p>、<figure><img/></figure> 要下钻，否则整段连同图一起被吞
          if((EPUB_BLOCKS.has(kt) && !EPUB_SKIP.has(kt)) || kt === "img" || kt === "svg" || kt === "image"){
            hasBlock = true; break;
          }
        }
        if(hasBlock){ walk(c); continue; }   // 块里还套着块 → 继续下钻，别把整段压成一行
        const lines = [];
        epubPushLines(epubNodeText(c), lines);
        for(const ln of lines) out.push({ text: ln, level: hm ? +hm[1] : 0 });
      }
    })(root);
    return { list: out, anchors };
  }
  // href/src → 锚点 id（去掉路径与查询串，解码 %xx）
  function epubAnchor(href){
    const s = String(href || "");
    const i = s.indexOf("#");
    if(i < 0) return "";
    let a = s.slice(i + 1);
    try{ a = decodeURIComponent(a); }catch(_){}
    return a;
  }
  function epubCleanTitle(s){
    const t = String(s || "").replace(/[\s\u00a0\u3000]+/g, " ").replace(/^[·•\-—–\s]+|[·•\-—–\s]+$/g, "").trim();
    return (t || "未命名章节").slice(0, 40);
  }
  // 锚点 id 失效时（换排版工具、重导一次 id 就变了，很常见），退一步用目录标题在正文里找同一行。
  // 先只认标题级标签（h1~h4），再退到普通段落 —— 有些书的章名根本没包在 h 标签里。
  function epubFindBlockByTitle(blocks, title){
    const t = epubCleanTitle(title);
    for(let pass = 0; pass < 2; pass++){
      for(let k = 0; k < blocks.length; k++){
        const b = blocks[k];
        if(!b.text) continue;
        const isHead = b.level >= 1 && b.level <= 4;
        if(pass === 0 ? !isHead : !!b.level) continue;
        if(epubSameTitle(b.text, t)) return k;
      }
    }
    return -1;
  }
  // 正文首行与章节标题是不是同一句（「第一章 X」vs「第1章 X」也要认出来）
  function epubSameTitle(line, title){
    const norm = s => String(s || "").replace(/[\s\u00a0\u3000·•\-—–_=:：.。!！?？"“”'‘’（）()【】\[\]]/g, "");
    const a = norm(line), b = norm(title);
    if(!a || !b) return false;
    if(a === b) return true;
    const an = a.replace(/[0-9零一二三四五六七八九十百千两]/g, "");
    const bn = b.replace(/[0-9零一二三四五六七八九十百千两]/g, "");
    return an.length >= 2 && an === bn;
  }

  // 主入口：File → { text, toc, title }
  async function parseEpub(file, onMsg){
    const say = m => { try{ if(onMsg) onMsg(m); }catch(_){} };
    const u8 = new Uint8Array(await file.arrayBuffer());
    say("正在解包…");
    const entries = zipIndex(u8);
    const read = async name => {
      const key = zipKey(entries, name);
      if(!key) return null;
      return await zipEntryData(u8, entries.get(key));
    };

    // 带 DRM 的书直接说清楚；只混淆字体的（很常见）不管
    const encBytes = await read("META-INF/encryption.xml");
    if(encBytes){
      const t = epubDecode(encBytes);
      const uris = [];
      const re = /URI\s*=\s*["']([^"']+)["']/gi;
      let m;
      while((m = re.exec(t))) uris.push(m[1]);
      if(uris.some(u => !/\.(ttf|otf|woff2?)$/i.test(u))){
        throw new Error("这本 EPUB 带 DRM 加密，无法解析");
      }
    }

    // 1) container.xml → OPF 路径
    let opfPath = "";
    const contBytes = await read("META-INF/container.xml");
    if(contBytes){
      const rf = epubEls(epubXml(epubDecode(contBytes)), "rootfile")[0];
      if(rf) opfPath = rf.getAttribute("full-path") || "";
    }
    if(!opfPath){
      for(const k of entries.keys()){ if(/\.opf$/i.test(k)){ opfPath = k; break; } }
    }
    if(!opfPath) throw new Error("EPUB 里找不到 OPF 书目文件");
    const opfKey = zipKey(entries, opfPath) || opfPath;
    const opfEnt = entries.get(opfKey);
    if(!opfEnt) throw new Error("EPUB 书目文件读取失败");
    say("正在读取书目…");
    const opf = epubXml(epubDecode(await zipEntryData(u8, opfEnt)));
    const opfDir = epubDir(opfKey);

    // 书名（dc:title）。拿不到就让调用方用文件名兜底
    let bookTitle = "";
    for(const el of epubEls(opf, "title")){
      const pn = el.parentNode && el.parentNode.localName ? el.parentNode.localName.toLowerCase() : "";
      const t = String(el.textContent || "").replace(/[\s\u00a0\u3000]+/g, " ").trim();
      if(!t) continue;
      bookTitle = t;
      if(pn === "metadata") break;
    }

    // 2) manifest + spine
    const manifest = new Map();
    for(const it of epubEls(opf, "item")){
      const id = it.getAttribute("id") || "";
      const href = it.getAttribute("href") || "";
      if(!id || !href) continue;
      manifest.set(id, {
        path: epubResolve(opfDir, href),
        type: (it.getAttribute("media-type") || "").toLowerCase(),
        props: (it.getAttribute("properties") || "").toLowerCase(),
      });
    }
    const spine = [];
    for(const ref of epubEls(opf, "itemref")){
      const it = manifest.get(ref.getAttribute("idref") || "");
      if(it) spine.push(it);
    }
    if(!spine.length) throw new Error("EPUB 的 spine 为空，读不出章节顺序");

    // 3) 目录：nav.xhtml（EPUB3）→ toc.ncx（EPUB2）。
    //    有目录就**按目录切章**：顺序、标题、层级都认它；只有目录没覆盖到的文件
    //    （封面/版权/附录常见）才用 spine + 正文小标题兜底。
    const navEntries = [];      // [{ title, path, anchor, depth }]，保持目录里的先后顺序
    let navItem = null;
    for(const it of manifest.values()) if(it.props.indexOf("nav") >= 0) navItem = it;
    if(navItem){
      say("正在读取目录…");
      const nb = await read(navItem.path);
      if(nb){
        const nd = new DOMParser().parseFromString(epubDecode(nb), "text/html");
        const navs = nd.querySelectorAll("nav");
        let target = null;
        for(const nv of navs){
          const ty = (nv.getAttribute("epub:type") || nv.getAttribute("type") || nv.getAttribute("role") || "").toLowerCase();
          if(ty.indexOf("toc") >= 0 || ty.indexOf("doc-toc") >= 0){ target = nv; break; }
        }
        if(!target) target = navs[0] || nd.body;
        const dir = epubDir(navItem.path);
        if(target){
          for(const a of target.querySelectorAll("a[href]")){
            const href = a.getAttribute("href") || "";
            const t = String(a.textContent || "").replace(/[\s\u00a0\u3000]+/g, " ").trim();
            const p = epubResolve(dir, href);
            if(!p || !t) continue;
            // 层级 = 祖先列表层数 - 1：最外层那个 ol 是第 0 层，不能算一档缩进
            let d = 0;
            for(let q = a.parentElement; q && q !== target; q = q.parentElement){
              const qt = (q.tagName || "").toUpperCase();
              if(qt === "OL" || qt === "UL") d++;
            }
            if(d > 0) d--;
            navEntries.push({ title: t, path: p, anchor: epubAnchor(href), depth: d });
          }
        }
      }
    }
    if(!navEntries.length){
      let ncx = null;
      for(const it of manifest.values()) if(it.type === "application/x-dtbncx+xml"){ ncx = it; break; }
      if(!ncx){
        const sp = epubEls(opf, "spine")[0];
        const tocId = sp && sp.getAttribute("toc");
        if(tocId && manifest.get(tocId)) ncx = manifest.get(tocId);
      }
      if(ncx){
        const nb = await read(ncx.path);
        if(nb){
          const nd = epubXml(epubDecode(nb));
          const dir = epubDir(ncx.path);
          // navPoint 是嵌套的，getElementsByTagName 的文档序刚好是父在前、子在后
          for(const np of epubEls(nd, "navPoint")){
            const lbl = epubEls(np, "text")[0];
            const ctt = epubEls(np, "content")[0];
            if(!lbl || !ctt) continue;
            const src = ctt.getAttribute("src") || "";
            const p = epubResolve(dir, src);
            const t = String(lbl.textContent || "").replace(/[\s\u00a0\u3000]+/g, " ").trim();
            if(!p || !t) continue;
            let d = 0;
            for(let q = np.parentNode; q; q = q.parentNode){
              if(q.localName === "navPoint") d++;
            }
            navEntries.push({ title: t, path: p, anchor: epubAnchor(src), depth: d });
          }
        }
      }
    }

    // 4) 逐个 spine 项抽正文。目录条目先按文件分组，文件内再按锚点行号切成多节。
    const lines = [];
    const toc = [];
    const images = [];          // [{src:dataURL, w, h}]，正文里只留 \u0001F|序号|宽|高 的占位行
    const imgCache = new Map();    // zip 内路径 → 图片元数据（同一张图被多章引用时只读一次）
    const docCount = spine.filter(it => /html/i.test(it.type) || /\.x?html?$/i.test(it.path)).length;
    // 目录太粗（条目不到文件数一半，多见于只列「卷」的书）时硬按目录合并，会把几十个
    // 文件挤成一章、分页要算上千页 —— 这种就只借目录的标题，位置仍按文件切。
    const coarseNav = docCount >= 5 && navEntries.length * 2 < docCount;
    const byPath = new Map();
    for(const e of navEntries){
      if(!byPath.has(e.path)) byPath.set(e.path, []);
      const arr = byPath.get(e.path);
      if(coarseNav){
        if(!arr.length) arr.push({ title: e.title, anchor: "", depth: 0 });
      } else {
        arr.push(e);
      }
    }
    const total = spine.length;
    for(let i = 0; i < total; i++){
      const it = spine[i];
      const isDoc = /html/i.test(it.type) || /\.x?html?$/i.test(it.path);
      if(!isDoc) continue;
      say("正在解析 " + (i + 1) + "/" + total + " …");
      // 每 8 章让出一次主线程：解包 + DOMParser 都是同步的，
      // 不让步的话进度提示从头到尾不会刷新，用户看到的是一个卡死的界面
      if(i % 8 === 0) await new Promise(r=>setTimeout(r, 0));
      const bytes = await read(it.path);
      if(!bytes) continue;
      const dom = new DOMParser().parseFromString(epubDecode(bytes), "text/html");
      const body = dom.body || dom.documentElement;
      if(!body) continue;
      const parsed = epubBlocks(body);
      const blocks = parsed.list;
      if(!blocks.length) continue;

      // 图片：从 zip 里取出来转成 data URL（纯本地，不发任何请求）。
      // 6MB 以上的单图直接跳过 —— 塞进正文会把 IndexedDB 和分页都拖垮。
      for(const b of blocks){
        if(!b.img) continue;
        const ip = epubResolve(epubDir(it.path), b.img);
        let meta = imgCache.get(ip);
        if(meta === undefined){
          meta = null;
          const ib = ip ? await read(ip) : null;
          if(ib && ib.length && ib.length <= 6 * 1024 * 1024){
            const url = "data:" + epubImgMime(ip) + ";base64," + epubB64(ib);
            const dim = await epubImgSize(url);
            if(dim.w > 0 && dim.h > 0) meta = { src: url, w: dim.w, h: dim.h };
          }
          imgCache.set(ip, meta);
        }
        b.img = null;
        if(meta){
          b.text = "\u0001F|" + images.length + "|" + meta.w + "|" + meta.h;
          images.push(meta);
        } else {
          b.text = "";        // 取不到（缺文件/过大/解码失败）就当这里没有图，正文照常
        }
      }

      const firstHead = blocks.find(b => b.level >= 1 && b.level <= 3);
      const titleEl = dom.querySelector("title");
      const docTitle = titleEl ? String(titleEl.textContent || "").trim() : "";
      const fileTitle = (firstHead && firstHead.text) || docTitle || ("第 " + (toc.length + 1) + " 节");
      const dirEntries = byPath.get(it.path) || [];

      // 本文件内的切点 [{ from, title, depth }]，from 是块下标
      const spans = [];
      for(const e of dirEntries){
        let at = 0;
        if(e.anchor){
          const a = parsed.anchors.get(e.anchor);
          if(typeof a === "number"){
            at = a;
          } else {
            // 锚点在文件里找不到（id 被换过）：用目录标题在正文里兜底定位，
            // 找不到就不切 —— 宁可不切，也别按猜的位置把一章劈错
            const k = epubFindBlockByTitle(blocks, e.title);
            if(k < 0) continue;
            at = k;
          }
        }
        if(spans.length && at <= spans[spans.length - 1].from) continue;   // 乱序/重复锚点
        spans.push({ from: at, title: e.title, depth: e.depth });
      }
      // 首条目录之前的页眉、版权声明等归进第一节，别丢成一节独立的
      if(spans.length) spans[0].from = 0;
      // 粗目录里只有「卷一」这种卷名，拿它当章名会把正文里的真实章标题压成冗余首行；
      // 有正文标题就用正文的，卷名只在文件里压根没标题时兜底
      if(coarseNav && firstHead && spans.length === 1) spans[0].title = firstHead.text;

      if(!spans.length){
        // 目录没覆盖这个文件（封面/版权/附录很常见）→ 按正文小标题兜底
        if(docCount < 5){
          // 整本书塞在一两个 xhtml 里、又没有目录 → 按 h1/h2 硬切
          const marks = [];
          for(let k = 0; k < blocks.length; k++){
            const b = blocks[k];
            if(b.level >= 1 && b.level <= 2) marks.push(k);
          }
          if(marks.length){
            if(marks[0] > 0) spans.push({ from: 0, title: fileTitle, depth: 0 });
            for(const k of marks) spans.push({ from: k, title: blocks[k].text, depth: 0 });
          }
        }
        if(!spans.length) spans.push({ from: 0, title: fileTitle, depth: 0 });
      }

      for(let s = 0; s < spans.length; s++){
        const from = spans[s].from;
        const to = (s + 1 < spans.length) ? spans[s + 1].from : blocks.length;
        const t = epubCleanTitle(spans[s].title);
        const bodyLines = [];
        for(let k = from; k < to; k++){
          const b = blocks[k];
          if(!b.text) continue;                                        // 取不到的图片留的空位
          // 章标题那一行由阅读页自己渲染，正文里再来一次就重复了；
          // 其余 h1/h2 是正文里的分节标题，必须留着，不能当噪声丢掉
          if(b.level >= 1 && b.level <= 2 && epubSameTitle(b.text, t)) continue;
          bodyLines.push(b.text);
        }
        // 正文开头跟标题重复的那一行去掉：大标题由阅读页自己渲染，不能出现两次
        while(bodyLines.length && epubSameTitle(bodyLines[0], t)) bodyLines.shift();
        if(!bodyLines.length) continue;
        toc.push({ title: t, start: lines.length + 1, end: 0, level: spans[s].depth || 0 });
        lines.push(t);                        // 标题占一行，只用于卡行号，不进正文
        for(const ln of bodyLines) lines.push(ln);
        toc[toc.length - 1].end = lines.length;
      }
    }

    if(!toc.length) throw new Error("EPUB 里没有解析到正文");
    return { text: lines.join("\n"), toc, title: bookTitle, images };
  }

  // ---------- 主题 ----------
  /* status = 页脚（电量/时间/页码/进度）+ 左上角小标题共用的弱化色。
     比正文淡一档：它是信息条，不该跟正文抢注意力。夜间主题要往「更接近底色」的方向淡（即更暗）。 */
  const themes = {
    paper: {bg:"#E8D5B0", text:"#4B2503", title:"#4B2503", status:"#AF8C71", panel:"#F0E6CE", swatch:"#E8D5B0", grip:"#ECDDBF", name:"日间纸"},
    green: {bg:"#C7EDCC", text:"#243024", title:"#3A5A40", status:"#7FA486", panel:"#DFF3E2", swatch:"#C7EDCC", grip:"#D2F1D6", name:"护眼绿"},
    black: {bg:"#16181C", text:"#A8A8A8", title:"#D6D6D6", status:"#5E626A", panel:"#22252B", swatch:"#16181C", grip:"#26282C", name:"夜间黑"},
    sepia: {bg:"#F5E6C8", text:"#4A3B28", title:"#6E5A45", status:"#AC9C82", panel:"#FBF1DC", swatch:"#F5E6C8", grip:"#F7EAD1", name:"羊皮卷"},
